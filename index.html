const KG=0.45359237;

/* ---------- ops: every change is a small op re-applied on top of the latest server copy ---------- */
function applyOp(d,o){
 const w=()=>d.workout||(d.workout={dayId:o.dayId||null,startedAt:new Date().toISOString(),finishedAt:null,sets:{},swaps:{}});
 switch(o.k){
  case 'foodAdd':if(!d.items.some(i=>i.id===o.item.id))d.items.push(o.item);break;
  case 'foodUpd':{const i=d.items.findIndex(x=>x.id===o.item.id);if(i>=0)d.items[i]=o.item;else d.items.push(o.item);break}
  case 'foodDel':d.items=d.items.filter(i=>i.id!==o.id);break;
  case 'steps':case 'weight':case 'note':d[o.k]=o.v;break;
  case 'wStart':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:null,sets:o.sets,swaps:{}};break;
  case 'wSets':w().sets[o.ex]=o.sets;if(o.t)w().lastAt=o.t;break;
  case 'wTimes':{const x=w();if(o.s)x.startedAt=o.s;if(o.f!==undefined)x.finishedAt=o.f;break}
  case 'wNote':{const x=w();if(o.v)x.note=o.v;else delete x.note;break}
  case 'wFinalize':{const x=w();Object.keys(x.sets||{}).forEach(ex=>{let a=x.sets[ex]||[];

  case 'wFinish':w().finishedAt=o.t;break;
  case 'wReopen':w().finishedAt=null;break;
  case 'wClear':d.workout=null;break;
  case 'merge':Object.assign(d,clone(o.data));break;
  case 'replace':d=clone(o.doc);break;
  case 'wMark':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:o.t,sets:{},swaps:{},marked:true};break;
  case 'actAdd':d.activities=d.activities||[];if(!d.activities.some(a=>a.id===o.a.id))d.activities.push(o.a);break;

/* ---------- GitHub backend ---------- */
class HttpErr extends Error{constructor(s,m){super(m||('HTTP '+s));this.status=s}}
const b64enc=s=>{const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
let KEEP=false;
async function gh(method,path,body,raw){
 const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method,cache:'no-store',keepalive:KEEP&&!!body,
  headers:Object.assign({Authorization:'Bearer '+cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined});
 return r;
}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const GH={
 async tree(){
  const r=await gh('GET','/git/trees/main?recursive=1');
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json(),m={};(j.tree||[]).forEach(t=>{if(t.type==='blob')m[t.path]=t.sha});return m;
 },
 async raw(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  return r.text();
 },
 async meta(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
 },
 async put(p,text,sha,msg){
  const body={message:msg,content:b64enc(text),branch:'main'};if(sha)body.sha=sha;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.content.sha};
 },
 async putBin(p,b64,msg){
  const m=await this.meta0(p);const body={message:msg,content:b64,branch:'main'};if(m)body.sha=m;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
 },
 async delBin(p,msg){const sha=await this.meta0(p);if(!sha)return;const r=await gh('DELETE','/contents/'+encPath(p),{message:msg,sha,branch:'main'});if(!r.ok&&r.status!==404)throw new HttpErr(r.status)},
 async meta0(p){const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');if(r.status===404)return null;if(!r.ok)throw new HttpErr(r.status);return (await r.json()).sha},
 async blobURL(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(!r.ok)throw new HttpErr(r.status);
  return URL.createObjectURL(await r.blob());
 }
};

let flushT=null,flushing=false,again=false,lastErr='';
function setSync(s,msg){UI.sync=s;UI.syncMsg=msg||'';const d=$('#sd');if(d){d.className='dot '+s;d.parentElement.title=s+(msg?': '+msg:'')}}
const isNet=e=>!(e instanceof HttpErr)&&!(e&&e.status);
const pendCount=()=>Object.values(DB.pend).reduce((a,q)=>a+q.length,0)+Object.keys(DB.photos).length+delQ().length;
function errText(e){
 if(isNet(e))return 'No connection. Your changes are saved on this phone and will sync when you are back online.';
 if(e.status===401||e.status===403)return 'GitHub rejected the token. Open settings and paste a new one.';
 if(e.status===404)return 'GitHub could not find the repo or branch. Check the repo name in settings.';
 if(e.status===409||e.status===422)return 'Could not merge a change after 3 tries. Tap the dot to retry.';
 return 'GitHub said no ('+(e.status||e.message)+'). Tap the dot to retry.';
}
function flushSoon(ms){clearTimeout(flushT);if(!pendCount())return;setSync(navigator.onLine===false?'offline':'syncing');flushT=setTimeout(()=>flush(),ms)}
async function flush(){
 clearTimeout(flushT);
 if(flushing){again=true;return}
 if(!pendCount()){if(UI.sync!=='offline'&&UI.sync!=='error')setSync('synced');return}
 flushing=true;setSync('syncing');
 try{
  await flushPhotos();
  for(const p of Object.keys(DB.pend)){if(DB.pend[p].length)await writePath(p)}
  setSync('synced');
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 finally{flushing=false;if(again){again=false;flushSoon(300)}}
}
function commitMsg(p,ops){const m=p.match(/data\/(food|log)\/(.+)\.json/);const k=ops[0].k;const what=k.startsWith('food')?'food':k.startsWith('w')?'sets':k;return 'app: log '+what+' '+(m?m[2]:p)}
async function writePath(p){

  const ops=DB.pend[p].slice();if(!ops.length)return;
  const f=DB.files[p]||(DB.files[p]={sha:null,base:null});
  let d=f.base?clone(f.base):blank(p);ops.forEach(o=>{d=applyOp(d,o)});
  try{
   const res=await B.put(p,JSON.stringify(d,null,2)+'\n',f.sha||undefined,commitMsg(p,ops));
   f.sha=res.sha;f.base=d;DB.pend[p]=DB.pend[p].filter(o=>ops.indexOf(o)<0);DB.tree[p]=res.sha;persist();softRender();return;
  }catch(e){
   if((e.status===409||e.status===422)&&attempt<3){const m=await B.meta(p);f.sha=m?m.sha:null;f.base=m?m.data:null;persist();continue}
   throw e;
  }
 }
}

function checklist(d){
 const l=logOf(d),pr=profile(),f=food(d).items,pd=progDay(d),dow=parseD(d).getDay();
 const meals=new Set(f.map(mealNo)).size,pk=Math.round(f.reduce((a,i)=>a+num(i.protein),0));
 const out=[{l:'Weigh in',ok:l.weight!=null,s:l.weight!=null?fwu(l.weight):'',act:'weightEdit'}];
 if(modOn('food'))out.push({l:'Track food',ok:meals>0,s:meals?meals+' meal'+(meals===1?'':'s')+', '+pk+'g protein':'',act:'gotoFood'});
 if(modOn('activity'))out.push({l:(pr.stepGoal/1000)+'k steps',ok:l.steps!=null&&l.steps>=pr.stepGoal,s:l.steps!=null?l.steps.toLocaleString('en-US'):'',act:'stepsEdit'});
 if(pd&&modOn('workout'))out.push({l:'Workout: '+esc(pd.name),ok:!!(l.workout&&l.workout.finishedAt),s:l.workout&&!l.workout.finishedAt?'in progress':'',act:'gotoWorkout'});
 if(dow===0)out.push({l:'Progress photos',ok:progPhotos().some(x=>x.d===d),s:'Sundays',act:'gotoBody'});
 return out;
}

/* ---------- Food ---------- */
const FOOD_SUBS=[['log','Log'],['insights','Insights']];
/* Floating totals: once the big calories card scrolls off, a slim strip with calories and P/C/F pins under the header. */
let fstIO=null;
function foodSticky(){if(fstIO){fstIO.disconnect();fstIO=null}
 const main=$('#fmain'),st=$('#fst');if(!main||!st||!window.IntersectionObserver)return;
 fstIO=new IntersectionObserver(([e])=>{const show=!e.isIntersecting&&e.boundingClientRect.top<0;if(show){const hd=document.querySelector('header');st.style.top=Math.max(0,hd?hd.getBoundingClientRect().bottom:0)+'px'}st.hidden=!show},{threshold:0});
 fstIO.observe(main)}
/* Calories vs target, judged by the goal instead of painted red. Within about 5% (at least 100 kcal) is On target.
   Cutting: going over is worth a look (amber). Gaining: leaving a lot uneaten is. Maintaining: only a big miss either way. */
function kcalVerdict(eaten,target){const g=profile().goalRate||0,diff=eaten-target,band=Math.max(100,target*.05),ab=Math.abs(diff);
 if(eaten>0&&ab<=band)return {l:'On target',v:(diff>=0?'+':'-')+rnd(ab),c:'var(--ok)'};
 if(diff<0)return {l:'Left',v:rnd(ab),c:g<0&&eaten>0?'var(--warn)':'var(--txt)'};
 return {l:'Over',v:rnd(ab),c:g>0||(g===0&&ab>band*3)?'var(--warn)':'var(--txt)'}}
/* Deficit or surplus for a day: maintenance (the adaptive estimate) plus that day's sport, minus what was eaten. */
function dayBurn(d){const sm=smartNow();return rnd(sm.tdee)+actsOf(d).reduce((a,x)=>a+(x.kcal||0),0)}
function deficitRow(d,kcal){const burn=dayBurn(d),def=burn-kcal,sport=actsOf(d).reduce((a,x)=>a+(x.kcal||0),0);
 return `<div class="row xs" style="margin-top:8px"><span class="mut sp">Burn ~${burn.toLocaleString('en-US')}${sport?' (maintenance + sport '+sport+')':' (maintenance)'}</span><b style="color:${def>=0?'var(--ok)':'var(--warn)'}">${def>=0?'Deficit':'Surplus'} ${Math.abs(def).toLocaleString('en-US')}</b></div>`}
function calChartCard(){
 const pr=profile(),T=today(),cv=[],cl=[];let logged=0,defSum=0;for(let i=6;i>=0;i--){const d=addDays(T,-i),k=totals(d).kcal;cv.push(k);cl.push('SMTWTFS'[parseD(d).getDay()]);if(k>0){logged++;defSum+=dayBurn(d)-k}}
 const avgDef=logged?rnd(defSum/logged):0,wkKg=(defSum/7700);
 const defCard=logged?`<div class="card"><div class="row"><div class="sp"><h3>${avgDef>=0?'Deficit':'Surplus'}</h3><div class="mut sm">Average on the ${logged} logged day${logged===1?'':'s'}, vs maintenance plus sport</div></div><div style="text-align:right"><b style="font-size:20px;color:${avgDef>=0?'var(--ok)':'var(--warn)'}">${Math.abs(avgDef).toLocaleString('en-US')}</b><div class="xs mut">kcal a day</div></div></div>
 <div class="xs mut" style="margin-top:6px">${Math.abs(defSum).toLocaleString('en-US')} kcal this week, about ${fw(Math.abs(wkKg),2)} ${wU()} ${defSum>=0?'of fat lost':'gained'} if it holds. ${imperial()?'3,500 kcal is roughly 1 lb.':'7,700 kcal is roughly 1 kg.'}</div></div>`:'';
 return defCard+`<div class="card"><div class="row"><div class="sp"><h3>Calories</h3><div class="mut sm">Last 7 days, target ${pr.targets.kcal}</div></div><div style="text-align:right"><b style="font-size:20px">${logged}/7</b><div class="xs mut">days logged</div></div></div>${logged?barChart(cv,cl,pr.targets.kcal):'<div class="empty">No meals logged this week. Add food or ask Claude.</div>'}</div>`;
}

  ${its.length?its.map(i=>`<button class="item" data-act="foodEdit" data-id="${esc(i.id)}">${i.photo?`<img class="ph" src="${esc(photoURL(i.photo))}" alt="">`:''}<div class="sp"><div class="n">${esc(i.name)}${i.by==='claude'?'<span class="tag">Claude</span>':''}</div><div class="xs mut">${esc(i.amount||'')}</div></div><div class="r"><div>${rnd(num(i.kcal))} cal</div><div class="xs mut">${rnd(num(i.protein))}g protein</div></div></button>`).join(''):`<div class="empty" style="padding:8px">Nothing here yet. Tap + to add.</div>`}</details>`}).join('');

 const strip=`<button class="fst" id="fst" hidden data-act="fstTop" aria-label="Back to the totals"><div><b>${big}</b><span class="mut">${isCons?'/ '+T.kcal+' cal':'cal left'}</span><span class="chip p">P ${mv(t.protein,T.protein)}</span><span class="chip c">C ${mv(t.carbs,T.carbs)}</span><span class="chip f">F ${mv(t.fat,T.fat)}</span></div></button>`;
 return fh+strip+`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="ib" data-act="dnav" data-n="-1" aria-label="Previous day">${ic('left')}</button><b>${d===today()?'Today, ':''}${fmtShort(d)}</b><button class="ib" data-act="dnav" data-n="1" aria-label="Next day">${ic('right')}</button></div>

 ${secs}<button class="addmeal" data-act="foodAdd" data-m="${nextMeal}"><span>+</span> Add meal</button>`;

/* ---------- Workout ---------- */
function prevFor(ex){
 const T=today();
 const days=Object.keys(DB.files).filter(p=>p.startsWith('data/log/')).map(p=>p.slice(9,19)).filter(d=>d<T).sort().reverse();
 for(const d of days){const l=view(logP(d));const s=l&&l.workout&&l.workout.sets&&l.workout.sets[ex];if(s){const dn=s.filter(x=>x.done);if(dn.length)return dn}}
 return null;
}
const unitOf=ex=>{const u=(exdb().exercises[ex]||{}).u;return u==='s'?'SEC':u==='m'?'M':'REPS'};
const effEx=(wo,slot)=>(wo.swaps&&wo.swaps[slot])||slot;
function musclesOf(day){
 const c={};day.exercises.forEach(e=>((exdb().exercises[e.ex]||{}).p||[]).forEach(m=>c[m]=(c[m]||0)+1));
 return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,6).map(m=>(exdb().muscles[m]||{name:m}).name);
}
function workoutView(){
 const T=today(),lg=logOf(T),wo=lg.workout,P=program();
 if(wo&&!wo.finishedAt)return liveView(wo,lg);
 const td=progDay(T);
 if(!UI.wSel)UI.wSel=T;
 const sel=UI.wSel,isT=sel===T,slog=logOf(sel),swo=slog.workout&&slog.workout.finishedAt?slog.workout:null,pd=progDay(sel);
 if(!UI.wDay||!isT)UI.wDay=(swo&&swo.dayId)||(pd?pd.id:null)||(td?td.id:P.days[0].id);
 const day=P.days.find(x=>x.id===(isT?UI.wDay:(swo&&swo.dayId)||(pd&&pd.id)))||null;
 const abbr=n=>n.split(/\s*\+\s*|\s+/).filter(Boolean).length>1?n.split(/\s*\+\s*|\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase():n;
 const wkd=weekDates(addDays(T,7*UI.wWk));
 const strip=wkd.map(x=>{const dw=parseD(x).getDay(),p=progDay(x),l=logOf(x),w=l.workout&&l.workout.finishedAt?l.workout:null;
  const cls=[x===T?'today':'',x===sel?'sel':'',w?'done':'',!p?'rest':'',!w&&p&&x<T?'miss':''].join(' ');
  const lab=w?abbr((P.days.find(q=>q.id===w.dayId)||{}).name||'Done'):p?abbr(p.name):'rest';
  return `<button class="wd ${cls}" data-act="wsel" data-d="${x}"><span>${'SMTWTFS'[dw]}</span><b>${parseD(x).getDate()}${w?'':''}</b><small>${esc(lab)}</small></button>`}).join('');
 let planned=0,did=0;wkd.forEach(x=>{if(progDay(x))planned++;const l=logOf(x);if(l.workout&&l.workout.finishedAt)did++});
 const nav=`<div class="mnav" style="margin-bottom:2px"><button class="ib" data-act="wwk" data-n="-1" aria-label="Previous week">${ic('left')}</button><div style="text-align:center"><b>${UI.wWk===0?'This week':UI.wWk===-1?'Last week':UI.wWk===1?'Next week':fmtShort(wkd[0])+' to '+fmtShort(wkd[6])}</b><div class="xs mut">${did} of ${planned} workouts done</div></div><button class="ib" data-act="wwk" data-n="1" aria-label="Next week">${ic('right')}</button></div>`;
 let body='';
 if(swo){
  const ns=Object.values(swo.sets||{}).reduce((a,s)=>a+s.filter(x=>x.done).length,0),dn=P.days.find(x=>x.id===swo.dayId)||{name:'Workout',exercises:[]};
  const exs=dn.exercises.map(e=>{const ex=effEx(swo,e.ex),sets=((swo.sets||{})[ex]||[]).filter(x=>x.done);if(!sets.length)return '';const u=unitOf(ex);
   return `<div class="item"><div class="sp"><div class="n">${esc(exName(ex))}</div><div class="xs mut">${sets.map(z=>setTxt(z,exU(ex))).join(', ')}${u==='SEC'?' s':u==='M'?' m':exU(ex)!==wU()?' '+exU(ex):''}</div></div><div class="r mut sm">${sets.length} set${sets.length===1?'':'s'}</div></div>`}).join('');
  body=`<div class="card"><div class="row"><div class="sp"><div class="xs mut">${isT?'Today':fmtLong(sel)}</div><h3>${esc(dn.name)} <span class="chip" style="background:var(--okbg);color:var(--oktx);vertical-align:middle">Done</span></h3><div class="mut sm">${swo.marked?'Marked done, no sets logged':ns+' sets - '+mmss((new Date(swo.finishedAt)-new Date(swo.startedAt))/1000)+' - '+rnd(kg2u(woStats(swo).vol)).toLocaleString('en-US')+' '+wU()}</div>${swo.marked?'':`<div class="xs mut">${clock(swo.startedAt)} to ${clock(swo.finishedAt)}</div>`}${swo.note?`<div class="sm" style="margin-top:6px;color:var(--soft)">${esc(swo.note)}</div>`:''}</div>${!isT&&swo.marked?`<button class="btn ghost sm" data-act="wUnmark" data-d="${sel}">Undo</button>`:`<button class="btn ghost sm" data-act="wEdit" data-d="${sel}">Edit</button>`}</div></div>
  ${swo.marked?'':`<div class="card"><h3>Sets</h3>${exs||'<div class="empty">No sets were checked off.</div>'}</div>`}`;
 }else if(!day){

function bfChart(h){
 const W=340,H=170,pl=30,pr=12,pt=14,pb=22,goal=14;
 const t=x=>parseD(x.d).getTime(),t0=t(h[0]),t1=Math.max(t(h[h.length-1]),t0+864e5*7);
 const lo=Math.min(goal-2,...h.map(x=>x.low)),hi=Math.max(...h.map(x=>x.high))+3;
 const X=x=>pl+(t(x)-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const band=h.map(x=>X(x).toFixed(1)+','+Y(x.high).toFixed(1)).join(' ')+' '+h.slice().reverse().map(x=>X(x).toFixed(1)+','+Y(x.low).toFixed(1)).join(' ');
 const line=h.map((x,i)=>(i?'L':'M')+X(x).toFixed(1)+' '+Y(x.pct).toFixed(1)).join(' ');
 const ticks=[];for(let v=Math.ceil(lo/5)*5;v<=hi;v+=5)ticks.push(v);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Body fat estimates over time">
 ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${Y(v)+3}" font-size="9" text-anchor="end" style="fill:var(--mut)">${v}%</text>`).join('')}
 <line x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke-dasharray="4 3" style="stroke:var(--ok)"/><text x="${W-pr}" y="${Y(goal)-4}" font-size="9" text-anchor="end" style="fill:var(--ok)">abs ~${goal}%</text>
 <polygon points="${band}" style="fill:var(--acc);opacity:.18"/>
 <path d="${line}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--acc)"/>
 ${h.map(x=>`<circle cx="${X(x).toFixed(1)}" cy="${Y(x.pct).toFixed(1)}" r="4" style="fill:var(--acc2)"/><text x="${X(x).toFixed(1)}" y="${(Y(x.pct)-8).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" style="fill:var(--txt)">${x.pct}%</text>`).join('')}
 <text x="${pl}" y="${H-5}" font-size="9" style="fill:var(--mut)">${fmtShort(h[0].d)}</text><text x="${W-pr}" y="${H-5}" font-size="9" text-anchor="end" style="fill:var(--mut)">${fmtShort(h[h.length-1].d)}</text></svg>
 <div class="xs mut">Shaded band is the estimate range.</div>`;
}

/* ---------- maintenance (TDEE) estimate ----------
   BMR: Mifflin-St Jeor. Daily life + digestion: 15% of BMR (sedentary baseline, steps counted separately).
   Walking: net 0.5 kcal per kg per km, stride 0.75 m, so about 0.000375 kcal per step per kg.
   Lifting: net 0.05 kcal per kg per minute of a finished workout (planned days assume 60 minutes).
   From data: average intake minus weight change (7,700 kcal per kg), once 14+ days are logged. */
function latestWeight(){const T=today();for(let i=0;i<60;i++){const w=logOf(addDays(T,-i)).weight;if(w!=null)return w}return profile().startWeight}
function bmrOf(w){const bf=latestBF();return FormaSmart.bmr(w,bf?bf.pct:null,profile().body);const b=profile().body||{};const h=b.heightCm||175,a=b.age||30,sx=b.sex==='female'?-161:5;return 10*w+6.25*h-5*a+sx}
function maintFor(steps,liftMin){const bf=latestBF();return FormaSmart.maint(latestWeight(),bf?bf.pct:null,profile().body,steps,liftMin)}
function woMinutes(d){const wo=logOf(d).workout;if(!wo||!wo.finishedAt)return 0;return Math.min(150,Math.max(0,(new Date(wo.finishedAt)-new Date(wo.startedAt))/60000))}
function smartNow(){
 const pr=profile(),T=today(),bf=latestBF(),days=[];
 for(let i=28;i>=1;i--){const d=addDays(T,-i),f=food(d).items;days.push({d,kcal:f.reduce((a,x)=>a+num(x.kcal),0),logged:f.length>0,weight:logOf(d).weight})}
 const liftDays=Object.values(program().weekdays).filter(x=>x!=='rest').length;
 const formula=FormaSmart.weekFormula(latestWeight(),bf?bf.pct:null,pr.body,pr.stepGoal,liftDays)+FormaSmart.extraKcal(pr.intake&&pr.intake.answers);
 return FormaSmart.smart({days,formula,targetKcal:pr.targets.kcal,goalRate:pr.goalRate||0.7});
}

 const kgWk=(sm.tdee-pr.targets.kcal)*7/7700;
 return `<div class="card"><div class="row"><div class="sp"><h3>Maintenance</h3><div class="mut sm">${sm.conf>0?'Learned from your logs, '+pct+'% confident':'Formula estimate until your logs take over'}</div></div><div style="text-align:right"><b style="font-size:20px">~${fmt(sm.tdee)}</b><div class="xs mut">kcal a day</div></div></div>
 <div class="sm" style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--inset);border-left:3px solid ${stTxt[0]}">${stTxt[1]}</div>
 <div style="margin-top:6px">
 ${row('Weight trend',sm.trendNow?fwu(sm.trendNow):'-',sm.rate==null?sm.weighIns+' weigh-ins in 28 days':(sm.rate<=0?'-':'+')+fw(Math.abs(sm.rate),2)+' '+wU()+' a week, smoothed')}

const PROG_SUBS=[['overview','Overview'],['photos','Photos'],['weight','Weight']],ACT_SUBS=[['steps','Steps'],['calendar','Calendar'],['sport','Sport']];
function spark(pts){if(pts.length<2)return '';const vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),r=hi-lo||1,n=pts[pts.length-1].i||1;

 return `<div class="ovg">
 ${tile('progress','weight','Weight',o.now==null?'-':fwu(o.now),rate,spark(o.wp))}
 ${tile('progress','weight','Since start',o.now==null?'-':(o.delta>0?'+':'')+fw(o.delta)+' '+wU(),'from '+fwu(pr.startWeight)+(pr.startDate?', '+fmtShort(pr.startDate):''))}
 ${tile('progress','weight','Body fat',bf?'~'+bf.pct+'%':'-',bf?'range '+bf.low+'-'+bf.high+'%, '+fmtShort(bf.d):'Send photos to Claude')}

/* Consistency: a day is on schedule if its planned workout was finished, or it was a rest day.
   Tracking starts at profile.startDate, so days before the app existed never count as missed. */
const trackStart=()=>profile().startDate||today();
const woDone=d=>{const w=logOf(d).workout;return !!(w&&w.finishedAt)};
const onSchedule=d=>woDone(d)||!progDay(d);
function schedStreak(){const T=today(),st=trackStart();let n=0,d=onSchedule(T)?T:addDays(T,-1);while(d>=st&&onSchedule(d)){n++;d=addDays(d,-1)}return n}
function schedBest(){const T=today(),st=trackStart();let b=0,c=0;for(let d=st;d<=T;d=addDays(d,1)){if(onSchedule(d)){c++;if(c>b)b=c}else if(d<T)c=0}return b}
/* Consistency calendar: every day fills up as its checklist gets ticked (weigh-in, food, steps, the planned workout,
   Sunday photos; only the modules that are on). A full day gets the gradient. Nothing is painted red: a planned workout
   that did not happen is a hollow ring, and tapping a day opens it on Today to see what was missing. */
function dayScore(d){const c=checklist(d);return {done:c.filter(x=>x.ok).length,all:c.length}}
const dayFull=d=>{const sc=dayScore(d);return sc.all>0&&sc.done===sc.all};
function stepsCalCard(){
 const T=today(),pr=profile(),st=trackStart();if(!UI.pM)UI.pM=ym(T);const m=UI.pM;
 const md=monthDates(m).filter(d=>d<=T&&d>=st);
 const full=md.filter(dayFull).length,fullStreak=streakOf(d=>d>=st&&dayFull(d));
 let best=0,c=0;for(let d=st;d<=T;d=addDays(d,1)){if(dayFull(d)){c++;if(c>best)best=c}else if(d<T)c=0}
 const planned=md.filter(d=>progDay(d)&&(d<T||woDone(d))).length,did=md.filter(d=>woDone(d)).length;
 const stepDays=md.filter(d=>dayFlags(d).hit).length,foodDays=md.filter(d=>dayFlags(d).food).length,wDays=md.filter(d=>dayFlags(d).weight).length,sportDays=md.filter(d=>actsOf(d).length).length;
 const ring=c=>`<i style="background:transparent;box-shadow:inset 0 0 0 1.5px ${c}"></i>`,dot=c=>`<i style="background:${c}"></i>`;
 const grid=monthGrid(m,d=>{const p=progDay(d),done=woDone(d),sp=actsOf(d).length>0;
  let mk='';
  if(done)mk+=dot('var(--wo)');else if(p&&d>T)mk+=ring('color-mix(in srgb,var(--wo) 55%,transparent)');else if(p&&d>=st)mk+=ring(d===T?'var(--wo)':'var(--faint)');
  if(sp)mk+=dot('var(--sport)');
  const marks=mk?`<span class="ds">${mk}</span>`:'';
  if(d>T||d<st)return {inner:marks};
  const sc=dayScore(d),lv=sc.all?Math.round(sc.done/sc.all*4):0;
  return {cls:'l'+lv,inner:marks}},'stepDay');
 const sw=(l,t)=>`<span><i class="sw l${l}"></i>${t}</span>`;
 return `<div class="card"><div class="row"><div class="sp"><h3>Consistency</h3><div class="mut sm">A day fills up as you tick its checklist</div></div></div>
 <div class="stk"><div><b>${fullStreak}</b><span>day streak</span></div><div><b>${full}<small class="mut" style="font-size:12px;font-weight:500">/${md.length}</small></b><span>full days this month</span></div><div><b>${best}</b><span>best streak</span></div></div>
 <div class="row sm" style="gap:6px;flex-wrap:wrap;margin:-2px 0 6px">${planned?`<span class="chip" style="background:color-mix(in srgb,var(--wo) 18%,transparent);color:var(--wo)">Workouts ${did}/${planned}</span>`:''}${modOn('activity')?`<span class="chip" style="background:var(--okbg);color:var(--oktx)">${(pr.stepGoal/1000)}k steps ${stepDays}/${md.length}</span>`:''}${modOn('food')?`<span class="chip">Food ${foodDays}/${md.length}</span>`:''}<span class="chip">Weigh-ins ${wDays}/${md.length}</span>${sportDays?`<span class="chip" style="background:color-mix(in srgb,var(--sport) 18%,transparent);color:var(--sport)">Sport ${sportDays}</span>`:''}</div>
 <div class="mnav"><button class="ib" data-act="pNav" data-n="-1" aria-label="Previous month">${ic('left')}</button><b>${monthName(m)}</b><button class="ib" data-act="pNav" data-n="1" aria-label="Next month" ${m>=ym(T)?'disabled style="opacity:.3"':''}>${ic('right')}</button></div>${grid}

 const keyUrl=`https://github.com/settings/personal-access-tokens/new?name=${keyName}&description=Forma+app+on+my+phone&target_name=${owner}&expires_in=366&contents=write`;
 return `<div class="setup"><h1>Forma</h1><div class="mut" style="margin-bottom:18px">One-time setup. The app needs a key to open your private data on GitHub. It takes about a minute.</div>

 <details class="sm mut" style="margin-top:14px"><summary>Advanced</summary><div class="fld" style="margin-top:10px"><label>Repository</label><input id="s_repo" value="${esc(cfg.repo)}" autocapitalize="off" autocorrect="off"></div></details></div>`;

async function setupSave(){
 const repo=$('#s_repo').value.trim(),tok=$('#s_tok').value.trim(),err=$('#s_err');
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){err.textContent='The repo should look like owner/name.';return}
 if(!tok){err.textContent='Paste your key first.';return}
 if(!/^(github_pat_|ghp_)\w{20,}$/.test(tok)){err.textContent='That is not a key yet. The key is a long code that starts with github_pat_. Tap "Create my key on GitHub" above to get one.';return}
 err.textContent='Testing...';const old=cfg;cfg={token:tok,repo};
 try{const r=await gh('GET','/contents/'+P_PROFILE+'?ref=main');
  if(r.status===401){throw new Error('GitHub says this key is wrong or expired. Copy it again, or make a new one.')}
  if(r.status===403){throw new Error('This key is missing the "Contents: read and write" permission. Make a new one with the button above.')}
  if(r.status===404)throw new Error('This key cannot see the forma repo. Make a new one and pick forma under Repository access.');
  if(!r.ok)throw new Error('GitHub answered '+r.status+'.');
 }catch(e){cfg=old;err.textContent=e instanceof TypeError?'No connection. Try again when you are online.':e.message;return}
 LS.set('forma.cfg',cfg);render();refresh(true);
}

/* ---------- sheet ---------- */
/* ---------- phone back button ----------
   Each overlay (sheet, camera, full-screen photo) adds a history entry, so Android's back closes it instead of
   leaving the app. Closing from the UI pops that entry (navPop). Pushes made while a pop is still in flight are
   queued, so close-then-open sequences keep the history in order. Tabs: Today is the base entry, any other tab
   is one entry above it, so back from Food, Workout or Progress returns to Today and back on Today exits. */
let navPending=0;const navQ=[];
function navPush(st){if(navPending)navQ.push(['push',st]);else history.pushState(st,'')}
function navReplace(st){if(navPending)navQ.push(['replace',st]);else history.replaceState(st,'')}
function navPop(){navPending++;history.back()}
function navTab(t){
 const from=UI.tab;if(t===from)return;
 if(from==='today')navPush({tab:t});else if(t==='today')navPop();else navReplace({tab:t});
 UI.tab=t;LS.set('forma.ui',{tab:UI.tab,mode:UI.mode});
}
function phvClose(fromPop){const v=$('#phv');if(!v)return;v.remove();if(!fromPop)navPop()}
window.addEventListener('popstate',e=>{
 if(navPending){navPending--;if(!navPending)while(navQ.length){const [k,st]=navQ.shift();if(k==='push')history.pushState(st,'');else history.replaceState(st,'')}return}
 if($('#phv')){phvClose(true);return}
 if($('#cam')){camClose(true);return}
 if($('#intake')){if(INT.step>0){INT.step--;navPush({l:'intake'});intakeUI()}else intakeClose(true);return}
 if(UI.sheet){closeSheet(true);return}
 const t=(e.state&&e.state.tab)||'today';if(t!==UI.tab){UI.tab=t;LS.set('forma.ui',{tab:UI.tab,mode:UI.mode});window.scrollTo(0,0);render()}
});
function openSheet(html,fn){if(!UI.sheet)navPush({l:'sheet'});UI.sheet=html;UI.sheetFn=fn||null;renderSheet()}
function closeSheet(fromPop){if(!UI.sheet)return;UI.sheet=null;UI.sheetFn=null;renderSheet();if(fromPop!==true)navPop()}
function renderSheet(){
 let ov=$('#ov');
 if(!UI.sheet){if(ov)ov.remove();return}
 if(!ov){ov=document.createElement('div');ov.id='ov';ov.innerHTML='<div id="sheet" role="dialog"></div>';document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov)closeSheet(false)})}
 const sh=$('#sheet');if(sh.dataset.h!==UI.sheet){sh.innerHTML=UI.sheet;sh.dataset.h=UI.sheet}
}

 catch(x){toast('Could not read that photo.')}
 e.target.value='';
});
function toast0(m){const t=document.createElement('div');t.className='toast';t.style.cssText+=';background:var(--okbg);border-color:var(--okline);color:var(--oktx)';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.m)UI.open[d.dataset.m]=d.open},true);
document.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.f)return;
 const v=t.value.trim()===''?0:num(t.value);
 if(t.dataset.f==='dw'||t.dataset.f==='dr'){editSets(t.dataset.ex,s=>{const x=s[+t.dataset.i];if(x&&x.drops&&x.drops[+t.dataset.j])x.drops[+t.dataset.j][t.dataset.f==='dw'?'w':'r']=t.dataset.f==='dw'?toKgU(v,exU(t.dataset.ex)):v},{quiet:true,delay:2000});return}
 editSets(t.dataset.ex,s=>{if(s[+t.dataset.i])s[+t.dataset.i][t.dataset.f]=t.dataset.f==='w'?toKgU(v,exU(t.dataset.ex)):v},{quiet:true,delay:2000});
});
let ty=null;
document.addEventListener('touchstart',e=>{ty=window.scrollY===0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>110&&!UI.sheet){verChecked=0;checkVersion();refresh(true)}ty=null},{passive:true});

/* ---------- boot ---------- */
(async function boot(){
 history.replaceState({tab:'today'},'');if(UI.tab!=='today')history.pushState({tab:UI.tab},'');
 if(DEMO){await DEMOB.init();render();await refresh(true);return}
 render();
 checkVersion();
 if(cfg.token){await refresh();if(pendCount())flushSoon(200)}
})();
</script>
</body>
