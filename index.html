<style>
:root{--bg:#0E1525;--card:#172033;--card2:#1d2840;--line:#26324b;--txt:#fff;--mut:#8b97b3;--acc:#3B82F6;--acc2:#8B5CF6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--grad:linear-gradient(90deg,#3B82F6,#8B5CF6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--txt);background:#0f1829;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px;outline:none}
input:focus{border-color:var(--acc)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
header h1{font-size:20px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--card)}

.dot.syncing{background:var(--acc);animation:p 1s infinite}.dot.offline{background:var(--warn)}.dot.error{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
svg{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}

.btn{background:var(--acc);color:#fff;border-radius:14px;min-height:46px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.red{background:#3a1b24;color:#ff8a8a}

.ring .tr{stroke:#0f1829}.ring .pg{stroke:url(#ringGrad);transition:stroke-dashoffset .3s}
.ring.over .pg{stroke:url(#ringOver)}

a{color:var(--acc)}

<body>
<div class="wrap" id="root"></div>
<div id="rest" hidden></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=s=>{const d=parseD(s);return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()};
const fmtShort=s=>{const d=parseD(s);return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()};
const today=()=>ymd(new Date());
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const rnd=n=>Math.round(n);
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mmss=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
const DEMO=/[?&]demo=1/.test(location.search);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const IC={
 today:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-3 2-4 6-4 9h4"/>',
 workout:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
 progress:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- state + cache ---------- */
let cfg=DEMO?{token:'demo',repo:'demo/forma'}:LS.get('forma.cfg',{token:'',repo:'jtpedrola-cloud/forma'});
let DB=DEMO?{files:{},pend:{},tree:{}}:LS.get('forma.db',{files:{},pend:{},tree:{}});DB.photos=DB.photos||{};
if(!DB.files)DB={files:{},pend:{},tree:{}};
const persist=()=>{if(!DEMO)LS.set('forma.db',DB)};
const TABS=['today','food','workout','progress'],savedUI=LS.get('forma.ui',{});
const UI={tab:TABS.includes(savedUI.tab)?savedUI.tab:'today',date:today(),wDay:null,mode:savedUI.mode==='remaining'?'remaining':'consumed',open:{},sync:'synced',syncMsg:'',cues:{},rest:null,sheet:null};
const P_PROFILE='data/profile.json',P_PROG='data/program.json',P_EX='data/exercises.json';
const base=p=>DB.files[p]&&DB.files[p].base;
const profile=()=>base(P_PROFILE),program=()=>base(P_PROG),exdb=()=>base(P_EX);
const foodP=d=>'data/food/'+d+'.json',logP=d=>'data/log/'+d+'.json';
const blank=p=>{const m=p.match(/(\d{4}-\d{2}-\d{2})\.json$/);const date=m?m[1]:'';return p.includes('/food/')?{date,items:[]}:{date,steps:null,weight:null,note:'',workout:null}};

/* ---------- ops: every change is a small op re-applied on top of the latest server copy ---------- */
function applyOp(d,o){
 const w=()=>d.workout||(d.workout={dayId:o.dayId||null,startedAt:new Date().toISOString(),finishedAt:null,sets:{},swaps:{}});
 switch(o.k){
  case 'foodAdd':if(!d.items.some(i=>i.id===o.item.id))d.items.push(o.item);break;
  case 'foodUpd':{const i=d.items.findIndex(x=>x.id===o.item.id);if(i>=0)d.items[i]=o.item;else d.items.push(o.item);break}
  case 'foodDel':d.items=d.items.filter(i=>i.id!==o.id);break;
  case 'steps':case 'weight':case 'note':d[o.k]=o.v;break;
  case 'wStart':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:null,sets:o.sets,swaps:{}};break;
  case 'wSets':w().sets[o.ex]=o.sets;break;
  case 'wSwap':{const x=w();x.swaps=x.swaps||{};if(o.alt===o.slot)delete x.swaps[o.slot];else x.swaps[o.slot]=o.alt;
    if(o.moved&&x.sets[o.from]&&!x.sets[o.to]){x.sets[o.to]=x.sets[o.from];delete x.sets[o.from]}break}
  case 'wFinish':w().finishedAt=o.t;break;
  case 'wReopen':w().finishedAt=null;break;
  case 'wClear':d.workout=null;break;
 }
 return d;
}
function view(p){
 const f=DB.files[p];let d=f&&f.base!=null?clone(f.base):null;
 const ops=DB.pend[p];
 if(ops&&ops.length){d=d||blank(p);ops.forEach(o=>{d=applyOp(d,o)})}
 return d;
}
const food=d=>view(foodP(d))||{date:d,items:[]};
const logOf=d=>view(logP(d))||blank(logP(d));
function mutate(p,op,o={}){
 const q=DB.pend[p]||(DB.pend[p]=[]);
 if(op.k==='wSets'||op.k==='steps'||op.k==='weight'||op.k==='note'){
  const i=q.findIndex(x=>x.k===op.k&&x.ex===op.ex);if(i>=0)q.splice(i,1)}
 q.push(op);persist();
 if(!o.quiet)render();
 flushSoon(o.delay==null?700:o.delay);
}

/* ---------- GitHub backend ---------- */
class HttpErr extends Error{constructor(s,m){super(m||('HTTP '+s));this.status=s}}
const b64enc=s=>{const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
let KEEP=false;
async function gh(method,path,body,raw){
 const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method,cache:'no-store',keepalive:KEEP&&!!body,
  headers:Object.assign({Authorization:'Bearer '+cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined});
 return r;
}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const GH={
 async tree(){
  const r=await gh('GET','/git/trees/main?recursive=1');
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json(),m={};(j.tree||[]).forEach(t=>{if(t.type==='blob')m[t.path]=t.sha});return m;
 },
 async raw(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  return r.text();
 },
 async meta(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
 },
 async put(p,text,sha,msg){
  const body={message:msg,content:b64enc(text),branch:'main'};if(sha)body.sha=sha;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.content.sha};
 },
 async putBin(p,b64,msg){
  const m=await this.meta0(p);const body={message:msg,content:b64,branch:'main'};if(m)body.sha=m;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
 },
 async meta0(p){const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');if(r.status===404)return null;if(!r.ok)throw new HttpErr(r.status);return (await r.json()).sha},
 async blobURL(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(!r.ok)throw new HttpErr(r.status);
  return URL.createObjectURL(await r.blob());
 }
};

/* ---------- meal photos: shrunk in the browser, stored in the repo under data/photos/ ---------- */
const PHOTOS={},PHLOAD={};
function shrinkImage(file){
 return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};img.src=u});
}
function photoURL(p){
 if(!p)return '';
 if(PHOTOS[p])return PHOTOS[p];
 if(DB.photos[p])return 'data:image/jpeg;base64,'+DB.photos[p];
 if(!PHLOAD[p]&&(DEMO||cfg.token)){PHLOAD[p]=true;B.blobURL(p).then(u=>{PHOTOS[p]=u;softRender();if(UI.sheet){const i=$('#f_phimg');if(i&&i.dataset.p===p){i.src=u;i.style.display=''}}}).catch(()=>{PHLOAD[p]=false})}
 return '';
}
async function flushPhotos(){
 for(const p of Object.keys(DB.photos)){
  await B.putBin(p,DB.photos[p],'app: photo '+p.split('/').slice(2).join('/'));
  PHOTOS[p]='data:image/jpeg;base64,'+DB.photos[p];delete DB.photos[p];persist();
 }
}

/* ---------- demo backend (in memory, seeded from ../data) ---------- */
let DEMOFILES=null,demoN=1;
const DEMOB={
 async init(){
  const F={},sha={};
  for(const n of ['profile','program','exercises']){F['data/'+n+'.json']=await (await fetch('../data/'+n+'.json')).text()}
  const prog=JSON.parse(F[P_PROG]),T=today();let seed=7;const rn=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const meals=[['breakfast','Oatmeal with banana','1 bowl',380,14,62,8],['breakfast','Eggs and toast','3 eggs, 2 toast',420,26,30,22],['lunch','Chicken adobo with rice','1 cup rice',650,42,70,20],['lunch','Tuna sandwich','1',430,32,40,14],['dinner','Grilled chicken, veg','200 g',520,48,20,18],['dinner','Beef and broccoli','1 plate',610,40,45,25],['snacks','Whey shake','1 scoop',130,25,3,2],['snacks','Banana','1',100,1,26,0]];
  for(let i=0;i<=10;i++){
   const d=addDays(T,-i),dow=parseD(d).getDay();
   const items=[];meals.forEach((m,k)=>{if(i===0&&k>2)return;if(rn()<.8)items.push({id:'d'+i+'-'+k,meal:({breakfast:1,lunch:2,snacks:3,dinner:4})[m[0]]||1,name:m[1],amount:m[2],kcal:m[3],protein:m[4],carbs:m[5],fat:m[6],by:k%2?'claude':'app',t:d+'T12:00:00Z'})});
   if(i===3)continue;

/* ---------- sync engine ---------- */
let flushT=null,flushing=false,again=false,lastErr='';
function setSync(s,msg){UI.sync=s;UI.syncMsg=msg||'';const d=$('#sd');if(d){d.className='dot '+s;d.parentElement.title=s+(msg?': '+msg:'')}}
const isNet=e=>!(e instanceof HttpErr)&&!(e&&e.status);
const pendCount=()=>Object.values(DB.pend).reduce((a,q)=>a+q.length,0)+Object.keys(DB.photos).length;
function errText(e){
 if(isNet(e))return 'No connection. Your changes are saved on this phone and will sync when you are back online.';
 if(e.status===401||e.status===403)return 'GitHub rejected the token. Open settings and paste a new one.';
 if(e.status===404)return 'GitHub could not find the repo or branch. Check the repo name in settings.';
 if(e.status===409||e.status===422)return 'Could not merge a change after 3 tries. Tap the dot to retry.';
 return 'GitHub said no ('+(e.status||e.message)+'). Tap the dot to retry.';
}
function flushSoon(ms){clearTimeout(flushT);if(!pendCount())return;setSync(navigator.onLine===false?'offline':'syncing');flushT=setTimeout(()=>flush(),ms)}
async function flush(){
 clearTimeout(flushT);
 if(flushing){again=true;return}
 if(!pendCount()){if(UI.sync!=='offline'&&UI.sync!=='error')setSync('synced');return}
 flushing=true;setSync('syncing');
 try{
  await flushPhotos();
  for(const p of Object.keys(DB.pend)){if(DB.pend[p].length)await writePath(p)}
  setSync('synced');
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 finally{flushing=false;if(again){again=false;flushSoon(300)}}
}
function commitMsg(p,ops){const m=p.match(/data\/(food|log)\/(.+)\.json/);const k=ops[0].k;const what=k.startsWith('food')?'food':k.startsWith('w')?'sets':k;return 'app: log '+what+' '+(m?m[2]:p)}
async function writePath(p){
 for(let attempt=0;attempt<4;attempt++){
  const ops=DB.pend[p].slice();if(!ops.length)return;
  const f=DB.files[p]||(DB.files[p]={sha:null,base:null});
  let d=f.base?clone(f.base):blank(p);ops.forEach(o=>{d=applyOp(d,o)});
  try{
   const res=await B.put(p,JSON.stringify(d,null,2)+'\n',f.sha||undefined,commitMsg(p,ops));
   f.sha=res.sha;f.base=d;DB.pend[p]=DB.pend[p].filter(o=>ops.indexOf(o)<0);DB.tree[p]=res.sha;persist();softRender();return;
  }catch(e){
   if((e.status===409||e.status===422)&&attempt<3){const m=await B.meta(p);f.sha=m?m.sha:null;f.base=m?m.data:null;persist();continue}
   throw e;
  }
 }
}
async function fetchFile(p,force){
 const f=DB.files[p];const sha=DB.tree[p];
 if(!force&&f&&f.sha===sha&&f.base!==undefined)return;
 const t=await B.raw(p);
 if(t==null){DB.files[p]={sha:null,base:null};return}

}
let refreshing=false;
async function refresh(force){
 if(!DEMO&&!cfg.token)return;
 if(refreshing)return;refreshing=true;setSync('syncing');
 try{
  if(pendCount())await flush();
  DB.tree=await B.tree();
  const T=today(),want=[P_PROFILE,P_PROG,P_EX];
  for(let i=0;i<=30;i++){const d=addDays(T,-i);want.push(foodP(d),logP(d))}
  const d0=UI.date;want.push(foodP(d0),logP(d0));
  await Promise.all([...new Set(want)].filter(p=>DB.tree[p]).map(p=>fetchFile(p,force)));
  Object.keys(DB.files).forEach(p=>{if(!DB.tree[p]&&DB.files[p].sha){DB.files[p]={sha:null,base:null}}});
  persist();
  if(!pendCount())setSync('synced');else flushSoon(200);
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 refreshing=false;softRender();
}
async function loadDay(d){

 if(!ps.length)return;

}

function prevFor(ex){

 const days=Object.keys(DB.files).filter(p=>p.startsWith('data/log/')).map(p=>p.slice(9,19)).filter(d=>d<T).sort().reverse();
 for(const d of days){const l=view(logP(d));const s=l&&l.workout&&l.workout.sets&&l.workout.sets[ex];if(s){const dn=s.filter(x=>x.done);if(dn.length)return dn}}

}
const unitOf=ex=>{const u=(exdb().exercises[ex]||{}).u;return u==='s'?'SEC':u==='m'?'M':'REPS'};
const effEx=(wo,slot)=>(wo.swaps&&wo.swaps[slot])||slot;
function musclesOf(day){
 const c={};day.exercises.forEach(e=>((exdb().exercises[e.ex]||{}).p||[]).forEach(m=>c[m]=(c[m]||0)+1));

  const ns=Object.values(wo.sets||{}).reduce((a,s)=>a+s.filter(x=>x.done).length,0);
  done=`<div class="card"><div class="row"><div class="sp"><h3>Workout done today</h3><div class="mut sm">${esc((P.days.find(x=>x.id===wo.dayId)||{}).name||'')} - ${ns} sets - ${mmss((new Date(wo.finishedAt)-new Date(wo.startedAt))/1000)}</div></div><button class="btn ghost sm" data-act="wReopen">Reopen</button></div></div>`;
 }
 return header('Workout')+done+`<div class="dchips">${chips}</div>
 <div class="mut sm" style="margin:-2px 0 8px">${!td?'Today is a rest day. Pick any day to preview or train anyway. ':'* marks today. '}</div>

 <div class="card"><h3>${day.exercises.length} Exercises</h3>${day.exercises.map(e=>`<div class="item"><div class="sp"><div class="n">${esc(exName(e.ex))}</div><div class="xs mut">${esc((exdb().exercises[e.ex]||{}).eq||'')}</div></div><div class="r mut sm">${e.sets} x ${esc(e.reps)}</div></div>`).join('')}</div>

function liveView(wo,lg){

/* ---------- Progress ---------- */
function barChart(vals,labels,target,fmt){
 const W=340,H=150,pl=4,pb=18,n=vals.length,mx=Math.max(target||0,...vals,1)*1.1,bw=(W-pl*2)/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>`;
 vals.forEach((v,i)=>{const h=v==null?0:v/mx*(H-pb-8),x=pl+i*bw+bw*.15;if(v!=null&&v>0)s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="3" fill="url(#g)"/>`;else s+=`<rect x="${x}" y="${H-pb-2}" width="${bw*.7}" height="2" rx="1" fill="#26324b"/>`;
  s+=`<text x="${x+bw*.35}" y="${H-4}" font-size="9" fill="#8b97b3" text-anchor="middle">${labels[i]}</text>`});
 if(target){const y=H-pb-target/mx*(H-pb-8);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#f59e0b" stroke-dasharray="4 3"/><text x="${W-2}" y="${y-3}" font-size="9" fill="#f59e0b" text-anchor="end">${fmt?fmt(target):target}</text>`}
 return s+'</svg>';
}
function lineChart(pts,startW){
 const W=340,H=150,px=8,py=18;
 const ys=pts.map(p=>p.v).concat([startW]),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5;
 const X=i=>px+i/29*(W-px*2),Y=v=>H-py-(v-mn)/(mx-mn)*(H-py*2);
 const path=pts.map((p,i)=>(i?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const ys0=Y(startW);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="0" x2="${W}" y1="${ys0}" y2="${ys0}" stroke="#26324b" stroke-dasharray="4 3"/><text x="${W-2}" y="${ys0-3}" font-size="9" fill="#8b97b3" text-anchor="end">start ${startW}</text>
 <path d="${path}" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#8B5CF6"/>`).join('')}
 <text x="${px}" y="${H-3}" font-size="9" fill="#8b97b3">30 days ago</text><text x="${W-px}" y="${H-3}" font-size="9" fill="#8b97b3" text-anchor="end">today</text></svg>`;
}
function progressView(){
 const pr=profile(),T=today();
 /* weight */
 const wp=[];for(let i=0;i<30;i++){const d=addDays(T,-(29-i)),w=logOf(d).weight;if(w!=null)wp.push({i,v:w})}
 const now=wp.length?wp[wp.length-1].v:null,delta=now==null?0:now-pr.startWeight;
 const wcard=wp.length>=2?lineChart(wp,pr.startWeight):`<div class="empty">${wp.length?'One weigh-in so far. Log another to see a trend.':'No weight logged yet. Log it from the Today tab.'}</div>`;
 /* steps */
 const sv=[],sl=[];for(let i=13;i>=0;i--){const d=addDays(T,-i);sv.push(logOf(d).steps);sl.push(parseD(d).getDate())}
 const sd=sv.filter(x=>x!=null),savg=sd.length?rnd(sd.reduce((a,b)=>a+b,0)/sd.length):0;
 /* calories */
 const cv=[],cl=[];let logged=0;for(let i=6;i>=0;i--){const d=addDays(T,-i),k=totals(d).kcal;cv.push(k);cl.push('SMTWTFS'[parseD(d).getDay()]);if(k>0)logged++}
 /* workouts */
 const wk=weekDates(T);let planned=0,did=0;wk.forEach(d=>{if(progDay(d))planned++;const w=logOf(d).workout;if(w&&w.finishedAt)did++});
 /* streak */
 let streak=0,i=hasData(T)?0:1;for(;i<31;i++){if(hasData(addDays(T,-i)))streak++;else break}
 return header('Progress')+`
 <div class="card"><div class="row"><div class="sp"><h3>Weight</h3><div class="mut sm">Last 30 days</div></div><div style="text-align:right"><b style="font-size:20px">${now==null?'-':now+' kg'}</b><div class="xs ${delta<=0?'':'mut'}" style="color:${delta<=0?'#22c55e':'#f59e0b'}">${now==null?'':(delta>0?'+':'')+delta.toFixed(1)+' since start ('+pr.startWeight+')'}</div></div></div>${wcard}</div>
 <div class="card"><div class="row"><div class="sp"><h3>Steps</h3><div class="mut sm">Last 14 days, goal ${pr.stepGoal.toLocaleString('en-US')}</div></div><div style="text-align:right"><b style="font-size:20px">${savg.toLocaleString('en-US')}</b><div class="xs mut">average</div></div></div>${sd.length?barChart(sv,sl,pr.stepGoal,v=>v/1000+'k'):'<div class="empty">No steps logged. Add them from the Today tab.</div>'}</div>
 <div class="card"><div class="row"><div class="sp"><h3>Calories</h3><div class="mut sm">Last 7 days, target ${pr.targets.kcal}</div></div><div style="text-align:right"><b style="font-size:20px">${logged}/7</b><div class="xs mut">days logged</div></div></div>${logged?barChart(cv,cl,pr.targets.kcal):'<div class="empty">No meals logged this week. Add food or ask Claude.</div>'}</div>
 <div class="row"><div class="card sp" style="margin:0 0 12px"><div class="xs mut">Workouts this week</div><div class="big">${did}<span class="mut sm" style="font-weight:400"> of ${planned}</span></div></div><div class="card sp" style="margin:0 0 12px"><div class="xs mut">Streak</div><div class="big">${streak}<span class="mut sm" style="font-weight:400"> day${streak===1?'':'s'}</span></div></div></div>`;
}

let ty=null;
document.addEventListener('touchstart',e=>{ty=window.scrollY===0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>110&&!UI.sheet)refresh(true);ty=null},{passive:true});

/* ---------- boot ---------- */
(async function boot(){
 if(DEMO){await DEMOB.init();render();await refresh(true);return}
 render();
 if(cfg.token){await refresh();if(pendCount())flushSoon(200)}
})();
</script>
</body>
