<html lang="en">

<title>Forma</title>
<style>
/* Themes. Every colour in the app comes from these tokens. Ember is the default (set by applyTheme); Midnight is the CSS fallback. */
:root,:root[data-theme="midnight"]{--bg:#0E1525;--card:#172033;--card2:#1d2840;--line:#26324b;--txt:#fff;--mut:#8b97b3;--faint:#4b5673;--soft:#c8d2ec;--inset:#0f1829;--nav:#0b1120;
 --acc:#3B82F6;--acc2:#8B5CF6;--onacc:#fff;--grad:linear-gradient(90deg,#3B82F6,#8B5CF6);
 --chip:#22304f;--chiptx:#b9c6e6;--chipb:#1c3566;--chipbtx:#8fbaff;--chipp:#3a2a66;--chipptx:#c4a8ff;--chipc:#153a3a;--chipctx:#7ee0d0;--chipf:#3d3011;--chipftx:#f5c96a;--chk:#3a4766;--restline:#2e5bb0;
 --ok:#22c55e;--okbg:#14532d;--oktx:#bbf7d0;--okin:#10301f;--okline:#1c5a37;--warn:#f59e0b;--warnline:#5a4210;--bad:#ef4444;--badbg:#3a1b24;--badtx:#ff8a8a;--badline:#6b2a3a}
:root[data-theme="ember"]{--bg:#070605;--card:#121010;--card2:#1b1715;--line:#2a2320;--txt:#f7f2ed;--mut:#9c9088;--faint:#4d4440;--soft:#e6dbd2;--inset:#0b0908;--nav:#050404;
 --acc:#ff5a1f;--acc2:#e11d48;--onacc:#fff;--grad:linear-gradient(90deg,#ff9a1f,#ff5a1f 45%,#e11d48);
 --chip:#221b18;--chiptx:#e3cdbd;--chipb:#3a1a0b;--chipbtx:#ffb27a;--chipp:#3d0f19;--chipptx:#ff8fa3;--chipc:#2a2418;--chipctx:#e8d3a8;--chipf:#3a2a0a;--chipftx:#ffd166;--chk:#4a3a33;--restline:#a8401a;
 --ok:#22c55e;--okbg:#123d22;--oktx:#bbf7d0;--okin:#0f2717;--okline:#1c5a37;--warn:#fbbf24;--warnline:#6b4a0c;--bad:#ef4444;--badbg:#3a1416;--badtx:#ff8a8a;--badline:#6b2a2a}
:root[data-theme="daylight"]{--bg:#f3f4f7;--card:#ffffff;--card2:#f1f3f8;--line:#e1e5ee;--txt:#0f172a;--mut:#64748b;--faint:#c0c8d6;--soft:#334155;--inset:#eef1f6;--nav:#ffffff;
 --acc:#4f46e5;--acc2:#0ea5e9;--onacc:#fff;--grad:linear-gradient(90deg,#4f46e5,#0ea5e9);
 --chip:#eef1f6;--chiptx:#334155;--chipb:#e0e7ff;--chipbtx:#3730a3;--chipp:#e0f2fe;--chipptx:#075985;--chipc:#dcfce7;--chipctx:#166534;--chipf:#fef3c7;--chipftx:#92400e;--chk:#cbd5e1;--restline:#a5b4fc;
 --ok:#16a34a;--okbg:#dcfce7;--oktx:#166534;--okin:#f0fdf4;--okline:#86efac;--warn:#d97706;--warnline:#fcd34d;--bad:#dc2626;--badbg:#fee2e2;--badtx:#b91c1c;--badline:#fca5a5}
:root[data-theme="ember"] .card,:root[data-theme="ember"] .sec{box-shadow:inset 0 1px 0 rgba(255,140,60,.06)}
:root[data-theme="ember"] .big{background:linear-gradient(180deg,#fff,#f3d9c8);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="daylight"] .card,:root[data-theme="daylight"] .sec{box-shadow:0 1px 2px rgba(15,23,42,.05)}
.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.thm button{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:left;background:var(--inset)}
.thm button.on{border-color:var(--acc)}
.thm .sw{height:44px;border-radius:9px;margin-bottom:6px;position:relative;overflow:hidden}
.thm .sw i{position:absolute;left:8px;right:8px;bottom:8px;height:6px;border-radius:3px}
.thm b{font-size:13px;display:block}.thm span{font-size:11px;color:var(--mut)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--txt);background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px;outline:none}
input:focus{border-color:var(--acc)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
header h1{font-size:20px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--card)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.dot.syncing{background:var(--acc);animation:p 1s infinite}.dot.offline{background:var(--warn)}.dot.error{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
svg{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.btn{background:var(--acc);color:var(--onacc);border-radius:14px;min-height:46px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.red{background:var(--badbg);color:var(--badtx)}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--inset);overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s}
.bar.over>i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.mac>div{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:84px;height:84px;margin:6px 0 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--inset)}.ring .pg{stroke:url(#ringGrad);transition:stroke-dashoffset .3s}
.ring.over .pg{stroke:url(#ringOver)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1}
.ring .v small{display:block;font-size:10px;font-weight:500;color:var(--mut);margin-top:2px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--chip);color:var(--chiptx);font-size:12px;font-weight:600;white-space:nowrap}
.chip.b{background:var(--chipb);color:var(--chipbtx)}.chip.p{background:var(--chipp);color:var(--chipptx)}.chip.c{background:var(--chipc);color:var(--chipctx)}.chip.f{background:var(--chipf);color:var(--chipftx)}
.sec summary .hd{flex:1;min-width:0;padding:10px 0}.sec summary .mc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sec summary .mc .chip{height:22px;padding:0 8px;font-size:11.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.week{display:flex;justify-content:space-between;margin:2px 0 14px}
.wd{width:12.5%;min-width:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:12px;min-height:60px}
.wd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--txt);font-weight:500;border:2px solid transparent;position:relative}
.wd.today b{border-color:var(--acc)}.wd.sel b{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.wd i{width:5px;height:5px;border-radius:50%;background:var(--mut);position:absolute;bottom:2px}
.wd.sel i{background:var(--onacc)}
.wd small{font-size:10px;color:var(--mut);max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.wd.done b{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}.wd.done.sel b{background:var(--acc);border-color:var(--acc)}
.wd.miss b{border-color:var(--badline)}.wd.rest b{color:var(--mut)}
.week.w2 .wd{min-height:74px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--mut);text-align:center;padding:2px 0 4px}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--inset);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;color:var(--soft);border:2px solid transparent;width:100%;min-height:40px}
.cal .c.fut{color:var(--faint)}.cal .c.today{border-color:var(--acc)}.cal .c.sel{border-color:var(--txt)}
.cal .c.hit{background:var(--okbg);color:var(--oktx)}.cal .c.part{background:var(--chipb);color:var(--chipbtx)}
.cal .ds{display:flex;gap:3px;height:5px}.cal .ds i{width:5px;height:5px;border-radius:50%;display:block}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.stk div{background:var(--inset);border-radius:12px;padding:10px 6px;text-align:center}.stk b{font-size:22px;display:block;line-height:1.1}.stk span{font-size:11px;color:var(--mut)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.card.warn{border-color:var(--warnline)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--mut);min-height:56px}
.tabs button.on{color:var(--acc)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.sec summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:54px;cursor:pointer;background:var(--card2);padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.sec:not([open]) summary{border-bottom:0}
.sec summary .t::before{content:'';display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--grad);margin-right:10px;vertical-align:-2px}
.sec .item,.sec .empty{padding-left:16px;padding-right:16px}
.sec .item:first-of-type{border-top:0}
.sec.empty-meal{opacity:.75;border-style:dashed}
.sec summary::-webkit-details-marker{display:none}
.sec summary .t{flex:1;font-weight:600}
.add{width:32px;height:32px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:20px;line-height:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left}
.item .n{font-weight:500;overflow-wrap:anywhere}
.item .r{text-align:right;white-space:nowrap}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--chipp);color:var(--chipptx);margin-left:6px;vertical-align:middle}
.seg{display:flex;background:var(--inset);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:36px;border-radius:10px;color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.dchips button{flex:none;padding:0 14px;min-height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px}
.dchips button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.ex{padding:12px 0;border-top:1px solid var(--line)}.ex:first-of-type{border:0}
.lbar{position:sticky;top:64px;z-index:15;background:var(--bg);padding:6px 0 8px}
.set{display:grid;grid-template-columns:34px 1fr 74px 74px 46px;gap:8px;align-items:center;margin-top:8px}
.set.h{color:var(--mut);font-size:11px;font-weight:700;margin-top:10px}
.set .sn{text-align:center;font-weight:600;color:var(--mut)}
.set input{text-align:center;padding:8px 4px;min-height:44px}
.set .pv{color:var(--mut);font-size:13px;text-align:center;min-height:44px;display:grid;place-items:center}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--chk);display:grid;place-items:center;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.dn input{background:var(--okin);border-color:var(--okline)}
.cues{background:var(--inset);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px;color:var(--soft)}
.cues li{margin:4px 0 4px 16px}
#rest{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25}
#rest>div{max-width:480px;margin:0 auto;padding:0 16px}
#rest .in{background:var(--chipb);border:1px solid var(--restline);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
#rest .bar{margin:0;flex:1;height:8px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
#sheet h2{margin:0 0 12px;font-size:19px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--inset);flex:none}
.phbig{width:100%;max-height:220px;object-fit:cover;border-radius:12px;background:var(--inset);margin-bottom:8px;display:block}
#ov.full{align-items:center;background:rgba(0,0,0,.92)}#ov.full img{max-width:100%;max-height:90vh;object-fit:contain}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--badbg);border:1px solid var(--badline);color:var(--badtx);padding:10px 14px;border-radius:12px;z-index:60;max-width:90%;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.setup{padding-top:40px}.setup h1{font-size:30px;margin:0 0 6px}
.setup ol{padding-left:20px;color:var(--soft)}.setup li{margin:6px 0}
a{color:var(--acc)}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.kv>span:last-child{white-space:nowrap;text-align:right}
</style>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=s=>{const d=parseD(s);return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()};
const fmtShort=s=>{const d=parseD(s);return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()};
const today=()=>ymd(new Date());
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const rnd=n=>Math.round(n);
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mmss=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
const DEMO=/[?&]demo=1/.test(location.search);
const THEMES=[['ember','Ember','Black, orange, red','#070605','#121010','linear-gradient(90deg,#ff9a1f,#ff5a1f 45%,#e11d48)'],
 ['midnight','Midnight','Navy, blue, violet','#0E1525','#172033','linear-gradient(90deg,#3B82F6,#8B5CF6)'],
 ['daylight','Daylight','Light, indigo, sky','#f3f4f7','#ffffff','linear-gradient(90deg,#4f46e5,#0ea5e9)']];
function applyTheme(id){const t=THEMES.find(x=>x[0]===id)||THEMES[0];document.documentElement.dataset.theme=t[0];
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t[3]);
 document.documentElement.style.colorScheme=t[0]==='daylight'?'light':'dark'}
try{applyTheme(JSON.parse(localStorage.getItem('forma.theme')||'"ember"'))}catch(e){applyTheme('ember')}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const IC={
 today:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-3 2-4 6-4 9h4"/>',
 workout:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
 progress:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/>',
 gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
 refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- state + cache ---------- */
let cfg=DEMO?{token:'demo',repo:'demo/forma'}:LS.get('forma.cfg',{token:'',repo:'jtpedrola-cloud/forma'});
let DB=DEMO?{files:{},pend:{},tree:{}}:LS.get('forma.db',{files:{},pend:{},tree:{}});DB.photos=DB.photos||{};
if(!DB.files)DB={files:{},pend:{},tree:{}};

/* ---------- ops: every change is a small op re-applied on top of the latest server copy ---------- */
function applyOp(d,o){
 const w=()=>d.workout||(d.workout={dayId:o.dayId||null,startedAt:new Date().toISOString(),finishedAt:null,sets:{},swaps:{}});
 switch(o.k){
  case 'foodAdd':if(!d.items.some(i=>i.id===o.item.id))d.items.push(o.item);break;
  case 'foodUpd':{const i=d.items.findIndex(x=>x.id===o.item.id);if(i>=0)d.items[i]=o.item;else d.items.push(o.item);break}
  case 'foodDel':d.items=d.items.filter(i=>i.id!==o.id);break;
  case 'steps':case 'weight':case 'note':d[o.k]=o.v;break;
  case 'wStart':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:null,sets:o.sets,swaps:{}};break;
  case 'wSets':w().sets[o.ex]=o.sets;break;
  case 'wSwap':{const x=w();x.swaps=x.swaps||{};if(o.alt===o.slot)delete x.swaps[o.slot];else x.swaps[o.slot]=o.alt;
    if(o.moved&&x.sets[o.from]&&!x.sets[o.to]){x.sets[o.to]=x.sets[o.from];delete x.sets[o.from]}break}
  case 'wFinish':w().finishedAt=o.t;break;
  case 'wReopen':w().finishedAt=null;break;
  case 'wClear':d.workout=null;break;
 }
 return d;
}
function view(p){
 const f=DB.files[p];let d=f&&f.base!=null?clone(f.base):null;
 const ops=DB.pend[p];
 if(ops&&ops.length){d=d||blank(p);ops.forEach(o=>{d=applyOp(d,o)})}
 return d;
}

function mutate(p,op,o={}){
 const q=DB.pend[p]||(DB.pend[p]=[]);
 if(op.k==='wSets'||op.k==='steps'||op.k==='weight'||op.k==='note'){
  const i=q.findIndex(x=>x.k===op.k&&x.ex===op.ex);if(i>=0)q.splice(i,1)}
 q.push(op);persist();
 if(!o.quiet)render();
 flushSoon(o.delay==null?700:o.delay);
}

/* ---------- GitHub backend ---------- */
class HttpErr extends Error{constructor(s,m){super(m||('HTTP '+s));this.status=s}}
const b64enc=s=>{const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
let KEEP=false;
async function gh(method,path,body,raw){
 const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method,cache:'no-store',keepalive:KEEP&&!!body,
  headers:Object.assign({Authorization:'Bearer '+cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined});
 return r;
}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const GH={
 async tree(){
  const r=await gh('GET','/git/trees/main?recursive=1');
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json(),m={};(j.tree||[]).forEach(t=>{if(t.type==='blob')m[t.path]=t.sha});return m;
 },
 async raw(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  return r.text();
 },
 async meta(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
 },
 async put(p,text,sha,msg){
  const body={message:msg,content:b64enc(text),branch:'main'};if(sha)body.sha=sha;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.content.sha};
 },
 async putBin(p,b64,msg){
  const m=await this.meta0(p);const body={message:msg,content:b64,branch:'main'};if(m)body.sha=m;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
 },
 async meta0(p){const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');if(r.status===404)return null;if(!r.ok)throw new HttpErr(r.status);return (await r.json()).sha},
 async blobURL(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(!r.ok)throw new HttpErr(r.status);
  return URL.createObjectURL(await r.blob());
 }
};

const PHOTOS={},PHLOAD={};
function shrinkImage(file){
 return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};img.src=u});
}

/* ---------- sync engine ---------- */
let flushT=null,flushing=false,again=false,lastErr='';
function setSync(s,msg){UI.sync=s;UI.syncMsg=msg||'';const d=$('#sd');if(d){d.className='dot '+s;d.parentElement.title=s+(msg?': '+msg:'')}}
const isNet=e=>!(e instanceof HttpErr)&&!(e&&e.status);
const pendCount=()=>Object.values(DB.pend).reduce((a,q)=>a+q.length,0)+Object.keys(DB.photos).length;
function errText(e){
 if(isNet(e))return 'No connection. Your changes are saved on this phone and will sync when you are back online.';
 if(e.status===401||e.status===403)return 'GitHub rejected the token. Open settings and paste a new one.';
 if(e.status===404)return 'GitHub could not find the repo or branch. Check the repo name in settings.';
 if(e.status===409||e.status===422)return 'Could not merge a change after 3 tries. Tap the dot to retry.';
 return 'GitHub said no ('+(e.status||e.message)+'). Tap the dot to retry.';
}
function flushSoon(ms){clearTimeout(flushT);if(!pendCount())return;setSync(navigator.onLine===false?'offline':'syncing');flushT=setTimeout(()=>flush(),ms)}
async function flush(){
 clearTimeout(flushT);
 if(flushing){again=true;return}
 if(!pendCount()){if(UI.sync!=='offline'&&UI.sync!=='error')setSync('synced');return}
 flushing=true;setSync('syncing');
 try{
  await flushPhotos();
  for(const p of Object.keys(DB.pend)){if(DB.pend[p].length)await writePath(p)}
  setSync('synced');
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 finally{flushing=false;if(again){again=false;flushSoon(300)}}
}
function commitMsg(p,ops){const m=p.match(/data\/(food|log)\/(.+)\.json/);const k=ops[0].k;const what=k.startsWith('food')?'food':k.startsWith('w')?'sets':k;return 'app: log '+what+' '+(m?m[2]:p)}
async function writePath(p){
 for(let attempt=0;attempt<4;attempt++){
  const ops=DB.pend[p].slice();if(!ops.length)return;
  const f=DB.files[p]||(DB.files[p]={sha:null,base:null});
  let d=f.base?clone(f.base):blank(p);ops.forEach(o=>{d=applyOp(d,o)});
  try{
   const res=await B.put(p,JSON.stringify(d,null,2)+'\n',f.sha||undefined,commitMsg(p,ops));
   f.sha=res.sha;f.base=d;DB.pend[p]=DB.pend[p].filter(o=>ops.indexOf(o)<0);DB.tree[p]=res.sha;persist();softRender();return;
  }catch(e){
   if((e.status===409||e.status===422)&&attempt<3){const m=await B.meta(p);f.sha=m?m.sha:null;f.base=m?m.data:null;persist();continue}
   throw e;
  }
 }
}
async function fetchFile(p,force){
 const f=DB.files[p];const sha=DB.tree[p];
 if(!force&&f&&f.sha===sha&&f.base!==undefined)return;
 const t=await B.raw(p);
 if(t==null){DB.files[p]={sha:null,base:null};return}
 DB.files[p]={sha,base:JSON.parse(t)};
}
let refreshing=false;
async function refresh(force){
 if(!DEMO&&!cfg.token)return;
 if(refreshing)return;refreshing=true;setSync('syncing');
 try{
  if(pendCount())await flush();
  DB.tree=await B.tree();
  const T=today(),want=[P_PROFILE,P_PROG,P_EX];
  for(let i=0;i<=30;i++){const d=addDays(T,-i);want.push(foodP(d),logP(d))}
  const d0=UI.date;want.push(foodP(d0),logP(d0));
  await Promise.all([...new Set(want)].filter(p=>DB.tree[p]).map(p=>fetchFile(p,force)));
  Object.keys(DB.files).forEach(p=>{if(!DB.tree[p]&&DB.files[p].sha){DB.files[p]={sha:null,base:null}}});
  persist();
  if(!pendCount())setSync('synced');else flushSoon(200);
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 refreshing=false;softRender();
}

const RING_DEFS=`<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient><linearGradient id="ringOver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs></svg>`;
function ring(l,v,g,opt){
 opt=opt||{};const r=36,c=2*Math.PI*r,p=g>0?Math.min(1,v/g):0,over=opt.over!==false&&v>g,shown=opt.remaining?Math.max(0,g-v):v;
 return `<div><div class="ring ${over?"over":""}"><svg viewBox="0 0 84 84"><circle class="tr" cx="42" cy="42" r="${r}"/><circle class="pg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg><div class="v">${rnd(shown)}<small>${opt.remaining?"left":"g"}</small></div></div><div class="xs mut">${l}</div><div class="xs"><b>${rnd(v)}</b> <span class="mut">/ ${g} g</span></div></div>`}

/* ---------- calendars and streaks ---------- */
const ym=d=>d.slice(0,7);
const monthDates=m=>{const [y,mo]=m.split('-').map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>y+'-'+pad(mo)+'-'+pad(i+1))};
const shiftMonth=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthName=m=>{const [y,mo]=m.split('-').map(Number);return MONTHS[mo-1]+' '+y};
function dayFlags(d){const l=logOf(d),g=profile().stepGoal;return {food:food(d).items.length>0,wo:!!(l.workout&&l.workout.finishedAt),steps:l.steps!=null,hit:l.steps!=null&&l.steps>=g,weight:l.weight!=null}}
function streakOf(fn){const T=today();let n=0,i=fn(T)?0:1;for(;i<400;i++){if(fn(addDays(T,-i)))n++;else break}return n}
function bestStreak(fn,days){let b=0,c=0;for(let i=days-1;i>=0;i--){if(fn(addDays(today(),-i))){c++;if(c>b)b=c}else c=0}return b}
function monthGrid(m,cell,act){

 return h+'</div>';
}
function calSheet(){

 for(const d of days){const l=view(logP(d));const s=l&&l.workout&&l.workout.sets&&l.workout.sets[ex];if(s){const dn=s.filter(x=>x.done);if(dn.length)return dn}}

const effEx=(wo,slot)=>(wo.swaps&&wo.swaps[slot])||slot;

 const c={};day.exercises.forEach(e=>((exdb().exercises[e.ex]||{}).p||[]).forEach(m=>c[m]=(c[m]||0)+1));

 return header('Workout')+nav+`<div class="week w2">${strip}</div>`+body+chips+

/* ---------- Progress ---------- */
function barChart(vals,labels,target,fmt){
 const W=340,H=150,pl=4,pb=18,n=vals.length,mx=Math.max(target||0,...vals,1)*1.1,bw=(W-pl*2)/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs>`;
 vals.forEach((v,i)=>{const h=v==null?0:v/mx*(H-pb-8),x=pl+i*bw+bw*.15;if(v!=null&&v>0)s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="3" fill="url(#g)"/>`;else s+=`<rect x="${x}" y="${H-pb-2}" width="${bw*.7}" height="2" rx="1" style="fill:var(--line)"/>`;
  s+=`<text x="${x+bw*.35}" y="${H-4}" font-size="9" style="fill:var(--mut)" text-anchor="middle">${labels[i]}</text>`});
 if(target){const y=H-pb-target/mx*(H-pb-8);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--warn)" stroke-dasharray="4 3"/><text x="${W-2}" y="${y-3}" font-size="9" style="fill:var(--warn)" text-anchor="end">${fmt?fmt(target):target}</text>`}
 return s+'</svg>';
}
function lineChart(pts,startW){
 const W=340,H=150,px=8,py=18;
 const ys=pts.map(p=>p.v).concat([startW]),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5;
 const X=i=>px+i/29*(W-px*2),Y=v=>H-py-(v-mn)/(mx-mn)*(H-py*2);
 const path=pts.map((p,i)=>(i?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const ys0=Y(startW);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="0" x2="${W}" y1="${ys0}" y2="${ys0}" style="stroke:var(--line)" stroke-dasharray="4 3"/><text x="${W-2}" y="${ys0-3}" font-size="9" style="fill:var(--mut)" text-anchor="end">start ${startW}</text>
 <path d="${path}" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" style="fill:var(--acc2)"/>`).join('')}
 <text x="${px}" y="${H-3}" font-size="9" style="fill:var(--mut)">30 days ago</text><text x="${W-px}" y="${H-3}" font-size="9" style="fill:var(--mut)" text-anchor="end">today</text></svg>`;
}
/* ---------- maintenance (TDEE) estimate ----------
   BMR: Mifflin-St Jeor. Daily life + digestion: 15% of BMR (sedentary baseline, steps counted separately).
   Walking: net 0.5 kcal per kg per km, stride 0.75 m, so about 0.000375 kcal per step per kg.
   Lifting: net 0.05 kcal per kg per minute of a finished workout (planned days assume 60 minutes).
   From data: average intake minus weight change (7,700 kcal per kg), once 14+ days are logged. */
function latestWeight(){const T=today();for(let i=0;i<60;i++){const w=logOf(addDays(T,-i)).weight;if(w!=null)return w}return profile().startWeight}
function bmrOf(w){const b=profile().body||{};const h=b.heightCm||175,a=b.age||30,sx=b.sex==='female'?-161:5;return 10*w+6.25*h-5*a+sx}
function maintFor(steps,liftMin){const w=latestWeight(),bmr=bmrOf(w);const life=bmr*.15,walk=(steps||0)*w*.000375,lift=(liftMin||0)*w*.05;return {w,bmr,life,walk,lift,total:bmr+life+walk+lift}}
function woMinutes(d){const wo=logOf(d).workout;if(!wo||!wo.finishedAt)return 0;return Math.min(150,Math.max(0,(new Date(wo.finishedAt)-new Date(wo.startedAt))/60000))}
function adaptiveTDEE(){
 const T=today();const days=[];for(let i=1;i<=28;i++){const d=addDays(T,-i);if(food(d).items.length)days.push(d)}
 const ws=[];for(let i=1;i<=28;i++){const d=addDays(T,-i),w=logOf(d).weight;if(w!=null)ws.push({d,w})}
 if(days.length<14||ws.length<4)return {ready:false,days:days.length};
 const span=Math.max(1,(parseD(ws[0].d)-parseD(ws[ws.length-1].d))/864e5);if(span<14)return {ready:false,days:days.length};
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,half=Math.ceil(ws.length/2);
 const dW=avg(ws.slice(0,half).map(x=>x.w))-avg(ws.slice(half).map(x=>x.w)),dDays=span/2;
 const intake=avg(days.map(d=>totals(d).kcal));
 return {ready:true,days:days.length,tdee:intake-dW*7700/dDays,intake,rate:dW/dDays*7};
}
function maintCard(){
 const pr=profile(),T=today(),b=pr.body||{},sg=pr.stepGoal;
 const train=maintFor(sg,60),rest=maintFor(5000,0);
 const perWeek=Object.values(program().weekdays).filter(x=>x!=='rest').length;
 let sum=0,n=0;for(let i=1;i<=7;i++){const d=addDays(T,-i),l=logOf(d);if(l.steps==null&&!woMinutes(d))continue;sum+=maintFor(l.steps==null?5000:l.steps,woMinutes(d)).total;n++}
 const wk=n?sum/n:null,typ=(train.total*perWeek+rest.total*(7-perWeek))/7;
 const gap=typ-pr.targets.kcal,kgWk=gap*7/7700,ad=adaptiveTDEE();
 const fmt=v=>rnd(v).toLocaleString('en-US');
 const row=(l,v,sub)=>`<div class="kv"><span class="mut">${l}${sub?`<div class="xs" style="color:var(--faint)">${sub}</div>`:''}</span><span>${v}</span></div>`;
 return `<div class="card"><div class="row"><div class="sp"><h3>Maintenance</h3><div class="mut sm">Calories you burn in a day (TDEE)</div></div><div style="text-align:right"><b style="font-size:20px">~${fmt(typ)}</b><div class="xs mut">per day, your week</div></div></div>
 <div style="margin-top:8px">${row('Body at rest (BMR)',fmt(train.bmr),'at '+train.w+' kg')}${row('Daily life and digestion','+'+fmt(train.life))}${row(sg.toLocaleString('en-US')+' steps','+'+fmt(train.walk))}${row('Lifting, about 60 min','+'+fmt(train.lift))}
 ${row('<b style="color:var(--txt)">Training day, '+(sg/1000)+'k steps</b>','<b>'+fmt(train.total)+'</b>')}${row('Rest day, 5k steps',fmt(rest.total))}
 ${wk?row('Last 7 days, from your logs',fmt(wk),n+' day'+(n===1?'':'s')+' with steps or a workout'):''}
 ${row('From your weight trend',ad.ready?'<b>'+fmt(ad.tdee)+'</b>':'<span class="mut">'+ad.days+' / 14 days</span>',ad.ready?'eating '+fmt(ad.intake)+', weight '+(ad.rate>0?'+':'')+ad.rate.toFixed(2)+' kg a week':'most accurate once 14 days of food and weight are logged')}</div>
 <div class="sm" style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--inset)">Target ${fmt(pr.targets.kcal)} is ${gap>=0?'about <b>'+fmt(gap)+' below</b>':'about <b>'+fmt(-gap)+' above</b>'} maintenance: roughly ${gap>=0?'-':'+'}${Math.abs(kgWk).toFixed(1)} kg a week.</div>
 ${b.assumed||!b.heightCm?`<div class="xs" style="color:var(--warn);margin-top:8px">Assumes ${b.sex||'male'}, ${b.age||30} years, ${b.heightCm||175} cm. Tell Claude your real height and age.</div>`:''}</div>`;
}
function progressView(){
 const pr=profile(),T=today();
 /* weight */
 const wp=[];for(let i=0;i<30;i++){const d=addDays(T,-(29-i)),w=logOf(d).weight;if(w!=null)wp.push({i,v:w})}
 const now=wp.length?wp[wp.length-1].v:null,delta=now==null?0:now-pr.startWeight;
 const wcard=wp.length>=2?lineChart(wp,pr.startWeight):`<div class="empty">${wp.length?'One weigh-in so far. Log another to see a trend.':'No weight logged yet. Log it from the Today tab.'}</div>`;
 /* steps */
 const sv=[],sl=[];for(let i=13;i>=0;i--){const d=addDays(T,-i);sv.push(logOf(d).steps);sl.push(parseD(d).getDate())}

 /* calories */
 const cv=[],cl=[];let logged=0;for(let i=6;i>=0;i--){const d=addDays(T,-i),k=totals(d).kcal;cv.push(k);cl.push('SMTWTFS'[parseD(d).getDay()]);if(k>0)logged++}
 /* workouts */

 return header('Progress')+maintCard()+`

 ${stepsCalCard()}

}

   const wo=logOf(T).workout,slot=D.slot,eff=effEx(wo,slot),orig=exdb().exercises[slot]||{};

   openSheet(`<h2>Swap ${esc(exName(slot))}</h2><div class="mut sm" style="margin-bottom:10px">Only for today. Your sets move over.</div>${opts.length?opts.map(x=>`<button class="item" data-act="doSwap" data-slot="${slot}" data-to="${x}"><div class="sp"><div class="n">${esc(exName(x))}${x===slot?' (original)':''}</div><div class="xs mut">${esc((exdb().exercises[x]||{}).eq||'')}</div></div></button>`).join(''):'<div class="empty">No alternatives listed for this exercise.</div>'}`);break}
  case 'doSwap':{const wo=logOf(T).workout;const from=effEx(wo,D.slot);mutate(logP(T),{k:'wSwap',slot:D.slot,alt:D.to,moved:true,from,to:D.to},{delay:1000});closeSheet();break}
 }
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='f_photo'||!e.target.files||!e.target.files[0])return;
 try{foodPhoto=await shrinkImage(e.target.files[0]);const im=$('#f_phimg');im.src=foodPhoto;im.style.display='';$('#f_phrm').style.display='';$('#f_phpick').textContent='Change photo'}
 catch(x){toast('Could not read that photo.')}
 e.target.value='';
});
function toast0(m){const t=document.createElement('div');t.className='toast';t.style.cssText+=';background:var(--okbg);border-color:var(--okline);color:var(--oktx)';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.m)UI.open[d.dataset.m]=d.open},true);
document.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.f)return;
 const v=t.value.trim()===''?0:num(t.value);
 editSets(t.dataset.ex,s=>{if(s[+t.dataset.i])s[+t.dataset.i][t.dataset.f]=v},{quiet:true,delay:2000});
});
let ty=null;
document.addEventListener('touchstart',e=>{ty=window.scrollY===0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>110&&!UI.sheet)refresh(true);ty=null},{passive:true});

(async function boot(){
 if(DEMO){await DEMOB.init();render();await refresh(true);return}
 render();
 if(cfg.token){await refresh();if(pendCount())flushSoon(200)}
})();
