<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=s=>{const d=parseD(s);return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()};

/* ---------- ops: every change is a small op re-applied on top of the latest server copy ---------- */
function applyOp(d,o){
 const w=()=>d.workout||(d.workout={dayId:o.dayId||null,startedAt:new Date().toISOString(),finishedAt:null,sets:{},swaps:{}});
 switch(o.k){
  case 'foodAdd':if(!d.items.some(i=>i.id===o.item.id))d.items.push(o.item);break;
  case 'foodUpd':{const i=d.items.findIndex(x=>x.id===o.item.id);if(i>=0)d.items[i]=o.item;else d.items.push(o.item);break}
  case 'foodDel':d.items=d.items.filter(i=>i.id!==o.id);break;
  case 'steps':case 'weight':case 'note':d[o.k]=o.v;break;
  case 'wStart':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:null,sets:o.sets,swaps:{}};break;
  case 'wSets':w().sets[o.ex]=o.sets;break;
  case 'wSwap':{const x=w();x.swaps=x.swaps||{};if(o.alt===o.slot)delete x.swaps[o.slot];else x.swaps[o.slot]=o.alt;
    if(o.moved&&x.sets[o.from]&&!x.sets[o.to]){x.sets[o.to]=x.sets[o.from];delete x.sets[o.from]}break}
  case 'wFinish':w().finishedAt=o.t;break;
  case 'wReopen':w().finishedAt=null;break;
  case 'wClear':d.workout=null;break;
  case 'actAdd':d.activities=d.activities||[];if(!d.activities.some(a=>a.id===o.a.id))d.activities.push(o.a);break;
  case 'actDel':d.activities=(d.activities||[]).filter(a=>a.id!==o.id);if(!d.activities.length)delete d.activities;break;
 }
 return d;
}

class HttpErr extends Error{constructor(s,m){super(m||('HTTP '+s));this.status=s}}
const b64enc=s=>{const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
let KEEP=false;
async function gh(method,path,body,raw){
 const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method,cache:'no-store',keepalive:KEEP&&!!body,
  headers:Object.assign({Authorization:'Bearer '+cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined});
 return r;
}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const GH={
 async tree(){
  const r=await gh('GET','/git/trees/main?recursive=1');
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json(),m={};(j.tree||[]).forEach(t=>{if(t.type==='blob')m[t.path]=t.sha});return m;
 },
 async raw(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  return r.text();
 },
 async meta(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');
  if(r.status===404)return null;
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
 },
 async put(p,text,sha,msg){
  const body={message:msg,content:b64enc(text),branch:'main'};if(sha)body.sha=sha;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
  const j=await r.json();return {sha:j.content.sha};
 },
 async putBin(p,b64,msg){
  const m=await this.meta0(p);const body={message:msg,content:b64,branch:'main'};if(m)body.sha=m;
  const r=await gh('PUT','/contents/'+encPath(p),body);
  if(!r.ok)throw new HttpErr(r.status);
 },
 async meta0(p){const r=await gh('GET','/contents/'+encPath(p)+'?ref=main');if(r.status===404)return null;if(!r.ok)throw new HttpErr(r.status);return (await r.json()).sha},
 async blobURL(p){
  const r=await gh('GET','/contents/'+encPath(p)+'?ref=main',null,true);
  if(!r.ok)throw new HttpErr(r.status);
  return URL.createObjectURL(await r.blob());
 }
};

let flushT=null,flushing=false,again=false,lastErr='';
function setSync(s,msg){UI.sync=s;UI.syncMsg=msg||'';const d=$('#sd');if(d){d.className='dot '+s;d.parentElement.title=s+(msg?': '+msg:'')}}
const isNet=e=>!(e instanceof HttpErr)&&!(e&&e.status);
const pendCount=()=>Object.values(DB.pend).reduce((a,q)=>a+q.length,0)+Object.keys(DB.photos).length;
function errText(e){
 if(isNet(e))return 'No connection. Your changes are saved on this phone and will sync when you are back online.';
 if(e.status===401||e.status===403)return 'GitHub rejected the token. Open settings and paste a new one.';
 if(e.status===404)return 'GitHub could not find the repo or branch. Check the repo name in settings.';
 if(e.status===409||e.status===422)return 'Could not merge a change after 3 tries. Tap the dot to retry.';
 return 'GitHub said no ('+(e.status||e.message)+'). Tap the dot to retry.';
}
function flushSoon(ms){clearTimeout(flushT);if(!pendCount())return;setSync(navigator.onLine===false?'offline':'syncing');flushT=setTimeout(()=>flush(),ms)}
async function flush(){
 clearTimeout(flushT);
 if(flushing){again=true;return}
 if(!pendCount()){if(UI.sync!=='offline'&&UI.sync!=='error')setSync('synced');return}
 flushing=true;setSync('syncing');
 try{
  await flushPhotos();
  for(const p of Object.keys(DB.pend)){if(DB.pend[p].length)await writePath(p)}
  setSync('synced');
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}
 finally{flushing=false;if(again){again=false;flushSoon(300)}}
}
function commitMsg(p,ops){const m=p.match(/data\/(food|log)\/(.+)\.json/);const k=ops[0].k;const what=k.startsWith('food')?'food':k.startsWith('w')?'sets':k;return 'app: log '+what+' '+(m?m[2]:p)}
async function writePath(p){
 for(let attempt=0;attempt<4;attempt++){
  const ops=DB.pend[p].slice();if(!ops.length)return;
  const f=DB.files[p]||(DB.files[p]={sha:null,base:null});
  let d=f.base?clone(f.base):blank(p);ops.forEach(o=>{d=applyOp(d,o)});
  try{
   const res=await B.put(p,JSON.stringify(d,null,2)+'\n',f.sha||undefined,commitMsg(p,ops));
   f.sha=res.sha;f.base=d;DB.pend[p]=DB.pend[p].filter(o=>ops.indexOf(o)<0);DB.tree[p]=res.sha;persist();softRender();return;
  }catch(e){
   if((e.status===409||e.status===422)&&attempt<3){const m=await B.meta(p);f.sha=m?m.sha:null;f.base=m?m.data:null;persist();continue}
   throw e;
  }
 }
}
async function fetchFile(p,force){
 const f=DB.files[p];const sha=DB.tree[p];
 if(!force&&f&&f.sha===sha&&f.base!==undefined)return;

 if(t==null){DB.files[p]={sha:null,base:null};return}
 DB.files[p]={sha,base:JSON.parse(t)};
}

  for(let i=0;i<=30;i++){const d=addDays(T,-i);want.push(foodP(d),logP(d))}
  const d0=UI.date;want.push(foodP(d0),logP(d0));
  await Promise.all([...new Set(want)].filter(p=>DB.tree[p]).map(p=>fetchFile(p,force)));
  Object.keys(DB.files).forEach(p=>{if(!DB.tree[p]&&DB.files[p].sha){DB.files[p]={sha:null,base:null}}});
  persist();
  if(!pendCount())setSync('synced');else flushSoon(200);
 }catch(e){lastErr=errText(e);setSync(isNet(e)?'offline':'error',lastErr);if(!isNet(e))toast(lastErr)}

}

function header(title,extra=''){

function tabbar(){

function render(){

/* ---------- derived numbers ---------- */
function totals(d){const t={kcal:0,protein:0,carbs:0,fat:0};food(d).items.forEach(i=>{t.kcal+=num(i.kcal);t.protein+=num(i.protein);t.carbs+=num(i.carbs);t.fat+=num(i.fat)});return t}
const LEGACY_MEAL={breakfast:1,lunch:2,snacks:3,dinner:4};
const mealNo=i=>typeof i.meal==='number'?i.meal:(LEGACY_MEAL[i.meal]||1);
const mealList=d=>{const n=Math.max(0,...food(d).items.map(mealNo));return Array.from({length:n+1},(_,k)=>k+1)};
const mealTot=(d,m)=>{const t={kcal:0,protein:0,carbs:0,fat:0};food(d).items.filter(i=>mealNo(i)===m).forEach(i=>{t.kcal+=num(i.kcal);t.protein+=num(i.protein);t.carbs+=num(i.carbs);t.fat+=num(i.fat)});return t};
const progDay=d=>{const id=program().weekdays[String(parseD(d).getDay())];return id==='rest'||!id?null:program().days.find(x=>x.id===id)};
const exName=id=>(exdb().exercises[id]||{n:id}).n;
function weekDates(d){const ws=(profile().weekStart||0);const dow=parseD(d).getDay();const s=addDays(d,-((dow-ws+7)%7));return Array.from({length:7},(_,i)=>addDays(s,i))}
const hasData=d=>{const f=view(foodP(d)),l=view(logP(d));return !!((f&&f.items.length)||(l&&(l.steps!=null||l.weight!=null||l.workout)))};

/* ---------- Macro rings ---------- */
const RING_DEFS=`<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient><linearGradient id="ringOver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs></svg>`;
function ring(l,v,g,opt){
 opt=opt||{};const r=36,c=2*Math.PI*r,p=g>0?Math.min(1,v/g):0,over=opt.over!==false&&v>g,shown=opt.remaining?Math.max(0,g-v):v;
 return `<div><div class="ring ${over?"over":""}"><svg viewBox="0 0 84 84"><circle class="tr" cx="42" cy="42" r="${r}"/><circle class="pg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg><div class="v">${rnd(shown)}<small>${opt.remaining?"left":"g"}</small></div></div><div class="xs mut">${l}</div><div class="xs"><b>${rnd(v)}</b> <span class="mut">/ ${g} g</span></div></div>`}

/* ---------- calendars and streaks ---------- */
const ym=d=>d.slice(0,7);
const monthDates=m=>{const [y,mo]=m.split('-').map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>y+'-'+pad(mo)+'-'+pad(i+1))};
const shiftMonth=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthName=m=>{const [y,mo]=m.split('-').map(Number);return MONTHS[mo-1]+' '+y};
const ACTS=[['basketball','Basketball',6.5],['badminton','Badminton',5.5],['volleyball','Volleyball',4],['tennis','Tennis',7],['pickleball','Pickleball',4.5],['football','Football',7],['running','Running',9],['cycling','Cycling',7],['swimming','Swimming',7],['hiking','Hiking',6],['boxing','Boxing',7.8],['other','Other',5]];
const actName=k=>(ACTS.find(a=>a[0]===k)||[k,k.charAt(0).toUpperCase()+k.slice(1)])[1];
const actKcal=(k,min,w)=>Math.round(((ACTS.find(a=>a[0]===k)||ACTS[ACTS.length-1])[2]-1)*w*min/60);
const actsOf=d=>logOf(d).activities||[];
const dayActKcal=d=>actsOf(d).reduce((a,x)=>a+(num(x.kcal)||0),0);
function dayFlags(d){const l=logOf(d),g=profile().stepGoal;return {sport:(l.activities||[]).length>0,food:food(d).items.length>0,wo:!!(l.workout&&l.workout.finishedAt),steps:l.steps!=null,hit:l.steps!=null&&l.steps>=g,weight:l.weight!=null}}
function streakOf(fn){const T=today();let n=0,i=fn(T)?0:1;for(;i<400;i++){if(fn(addDays(T,-i)))n++;else break}return n}
function bestStreak(fn,days){let b=0,c=0;for(let i=days-1;i>=0;i--){if(fn(addDays(today(),-i))){c++;if(c>b)b=c}else c=0}return b}
function monthGrid(m,cell,act){
 const ws=profile().weekStart||0,ds=monthDates(m),T=today();
 const lead=(parseD(ds[0]).getDay()-ws+7)%7;
 let h='<div class="cal">'+Array.from({length:7},(_,i)=>`<div class="dh">${'SMTWTFS'[(i+ws)%7]}</div>`).join('')+'<div></div>'.repeat(lead);
 ds.forEach(d=>{const c=cell(d)||{};h+=`<button class="c ${d===T?'today':''} ${d>T?'fut':''} ${c.cls||''}" data-act="${act}" data-d="${d}" ${d>T?'disabled':''}>${parseD(d).getDate()}${c.inner||''}</button>`});
 return h+'</div>';
}
function calSheet(){
 const m=UI.calM,T=today();
 const sF=streakOf(d=>dayFlags(d).food),sS=streakOf(d=>dayFlags(d).hit),sW=streakOf(d=>dayFlags(d).weight);
 const dot=(on,col)=>on?`<i style="background:${col}"></i>`:'';
 const grid=monthGrid(m,d=>{const f=dayFlags(d);const any=f.food||f.wo||f.steps||f.weight||f.sport;return {cls:d===UI.date?'sel':'',inner:any?`<span class="ds">${dot(f.food,'var(--acc)')}${dot(f.wo,'var(--wo)')}${dot(f.sport,'var(--sport)')}${dot(f.hit,'var(--ok)')}${dot(f.weight,'var(--warn)')}</span>`:''}},'calDay');
 return `<h2>Calendar</h2>
 <div class="stk"><div><b>${sF}</b><span>day food streak</span></div><div><b>${sS}</b><span>day step streak</span></div><div><b>${sW}</b><span>day weigh-in streak</span></div></div>
 <div class="mnav"><button class="ib" data-act="calNav" data-n="-1" aria-label="Previous month">${ic('left')}</button><b>${monthName(m)}</b><button class="ib" data-act="calNav" data-n="1" aria-label="Next month" ${m>=ym(T)?'disabled style="opacity:.3"':''}>${ic('right')}</button></div>
 ${grid}
 <div class="lg"><span><i style="background:var(--acc)"></i>Food logged</span><span><i style="background:var(--wo)"></i>Workout done</span><span><i style="background:var(--sport)"></i>Sport</span><span><i style="background:var(--ok)"></i>Step goal hit</span><span><i style="background:var(--warn)"></i>Weighed in</span></div>
 <div class="xs mut" style="margin-top:10px">Tap a day to open it.</div>`;
}

function checklist(d){
 const l=logOf(d),pr=profile(),f=food(d).items,pd=progDay(d),dow=parseD(d).getDay();
 const meals=new Set(f.map(mealNo)).size,pk=Math.round(f.reduce((a,i)=>a+num(i.protein),0));
 const out=[{l:'Weigh in',ok:l.weight!=null,s:l.weight!=null?l.weight+' kg':'',act:'weightEdit'},
  {l:'Track food',ok:meals>0,s:meals?meals+' meal'+(meals===1?'':'s')+', '+pk+'g protein':'',act:'gotoFood'},
  {l:(pr.stepGoal/1000)+'k steps',ok:l.steps!=null&&l.steps>=pr.stepGoal,s:l.steps!=null?l.steps.toLocaleString('en-US'):'',act:'stepsEdit'}];
 if(pd)out.push({l:'Workout: '+esc(pd.name),ok:!!(l.workout&&l.workout.finishedAt),s:l.workout&&!l.workout.finishedAt?'in progress':'',act:'gotoWorkout'});
 if(dow===0)out.push({l:'Progress photos',ok:progPhotos().some(x=>x.d===d),s:'Sundays',act:'gotoBody'});
 return out;
}

 const big=isCons?rnd(t.kcal):rnd(T.kcal-t.kcal);

/* ---------- Workout ---------- */
function prevFor(ex){
 const T=today();
 const days=Object.keys(DB.files).filter(p=>p.startsWith('data/log/')).map(p=>p.slice(9,19)).filter(d=>d<T).sort().reverse();
 for(const d of days){const l=view(logP(d));const s=l&&l.workout&&l.workout.sets&&l.workout.sets[ex];if(s){const dn=s.filter(x=>x.done);if(dn.length)return dn}}
 return null;
}
const unitOf=ex=>{const u=(exdb().exercises[ex]||{}).u;return u==='s'?'SEC':u==='m'?'M':'REPS'};
const effEx=(wo,slot)=>(wo.swaps&&wo.swaps[slot])||slot;
function musclesOf(day){
 const c={};day.exercises.forEach(e=>((exdb().exercises[e.ex]||{}).p||[]).forEach(m=>c[m]=(c[m]||0)+1));
 return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,6).map(m=>(exdb().muscles[m]||{name:m}).name);
}
function workoutView(){
 const T=today(),lg=logOf(T),wo=lg.workout,P=program();
 if(wo&&!wo.finishedAt)return liveView(wo,lg);
 const td=progDay(T);
 if(!UI.wSel)UI.wSel=T;
 const sel=UI.wSel,isT=sel===T,slog=logOf(sel),swo=slog.workout&&slog.workout.finishedAt?slog.workout:null,pd=progDay(sel);
 if(!UI.wDay||!isT)UI.wDay=(swo&&swo.dayId)||(pd?pd.id:null)||(td?td.id:P.days[0].id);
 const day=P.days.find(x=>x.id===(isT?UI.wDay:(swo&&swo.dayId)||(pd&&pd.id)))||null;
 const abbr=n=>n.split(/\s*\+\s*|\s+/).filter(Boolean).length>1?n.split(/\s*\+\s*|\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase():n;
 const wkd=weekDates(addDays(T,7*UI.wWk));
 const strip=wkd.map(x=>{const dw=parseD(x).getDay(),p=progDay(x),l=logOf(x),w=l.workout&&l.workout.finishedAt?l.workout:null;
  const cls=[x===T?'today':'',x===sel?'sel':'',w?'done':'',!p?'rest':'',!w&&p&&x<T?'miss':''].join(' ');
  const lab=w?abbr((P.days.find(q=>q.id===w.dayId)||{}).name||'Done'):p?abbr(p.name):'rest';
  return `<button class="wd ${cls}" data-act="wsel" data-d="${x}"><span>${'SMTWTFS'[dw]}</span><b>${parseD(x).getDate()}${w?'':''}</b><small>${esc(lab)}</small></button>`}).join('');
 let planned=0,did=0;wkd.forEach(x=>{if(progDay(x))planned++;const l=logOf(x);if(l.workout&&l.workout.finishedAt)did++});
 const nav=`<div class="mnav" style="margin-bottom:2px"><button class="ib" data-act="wwk" data-n="-1" aria-label="Previous week">${ic('left')}</button><div style="text-align:center"><b>${UI.wWk===0?'This week':UI.wWk===-1?'Last week':UI.wWk===1?'Next week':fmtShort(wkd[0])+' to '+fmtShort(wkd[6])}</b><div class="xs mut">${did} of ${planned} workouts done</div></div><button class="ib" data-act="wwk" data-n="1" aria-label="Next week">${ic('right')}</button></div>`;
 let body='';
 if(swo){
  const ns=Object.values(swo.sets||{}).reduce((a,s)=>a+s.filter(x=>x.done).length,0),dn=P.days.find(x=>x.id===swo.dayId)||{name:'Workout',exercises:[]};
  const exs=dn.exercises.map(e=>{const ex=effEx(swo,e.ex),sets=((swo.sets||{})[ex]||[]).filter(x=>x.done);if(!sets.length)return '';const u=unitOf(ex);

/* ---------- Progress ---------- */
function barChart(vals,labels,target,fmt){
 const W=340,H=150,pl=4,pb=18,n=vals.length,mx=Math.max(target||0,...vals,1)*1.1,bw=(W-pl*2)/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs>`;
 vals.forEach((v,i)=>{const h=v==null?0:v/mx*(H-pb-8),x=pl+i*bw+bw*.15;if(v!=null&&v>0)s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="3" fill="url(#g)"/>`;else s+=`<rect x="${x}" y="${H-pb-2}" width="${bw*.7}" height="2" rx="1" style="fill:var(--line)"/>`;
  s+=`<text x="${x+bw*.35}" y="${H-4}" font-size="9" style="fill:var(--mut)" text-anchor="middle">${labels[i]}</text>`});
 if(target){const y=H-pb-target/mx*(H-pb-8);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--warn)" stroke-dasharray="4 3"/><text x="${W-2}" y="${y-3}" font-size="9" style="fill:var(--warn)" text-anchor="end">${fmt?fmt(target):target}</text>`}
 return s+'</svg>';
}
function lineChart(pts,startW){
 const W=340,H=150,px=8,py=18;
 const ys=pts.map(p=>p.v).concat([startW]),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5;
 const X=i=>px+i/29*(W-px*2),Y=v=>H-py-(v-mn)/(mx-mn)*(H-py*2);
 let t=null;const tr=pts.map(p=>{t=t==null?p.v:t+0.1*(p.v-t);return {i:p.i,v:t}});
 const path=tr.map((p,i)=>(i?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const ys0=Y(startW);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="0" x2="${W}" y1="${ys0}" y2="${ys0}" style="stroke:var(--line)" stroke-dasharray="4 3"/><text x="${W-2}" y="${ys0-3}" font-size="9" style="fill:var(--mut)" text-anchor="end">start ${startW}</text>
 ${pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" style="fill:var(--mut);opacity:.7"/>`).join('')}
 <path d="${path}" fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 <text x="${px}" y="${H-3}" font-size="9" style="fill:var(--mut)">30 days ago</text><text x="${W-px}" y="${H-3}" font-size="9" style="fill:var(--mut)" text-anchor="end">today</text></svg>
 <div class="xs mut">Dots are daily weigh-ins, the line is the smoothed trend.</div>`;
}

function bfChart(h){
 const W=340,H=170,pl=30,pr=12,pt=14,pb=22,goal=14;
 const t=x=>parseD(x.d).getTime(),t0=t(h[0]),t1=Math.max(t(h[h.length-1]),t0+864e5*7);
 const lo=Math.min(goal-2,...h.map(x=>x.low)),hi=Math.max(...h.map(x=>x.high))+3;
 const X=x=>pl+(t(x)-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const band=h.map(x=>X(x).toFixed(1)+','+Y(x.high).toFixed(1)).join(' ')+' '+h.slice().reverse().map(x=>X(x).toFixed(1)+','+Y(x.low).toFixed(1)).join(' ');
 const line=h.map((x,i)=>(i?'L':'M')+X(x).toFixed(1)+' '+Y(x.pct).toFixed(1)).join(' ');
 const ticks=[];for(let v=Math.ceil(lo/5)*5;v<=hi;v+=5)ticks.push(v);

/* ---------- maintenance (TDEE) estimate ----------
   BMR: Mifflin-St Jeor. Daily life + digestion: 15% of BMR (sedentary baseline, steps counted separately).
   Walking: net 0.5 kcal per kg per km, stride 0.75 m, so about 0.000375 kcal per step per kg.
   Lifting: net 0.05 kcal per kg per minute of a finished workout (planned days assume 60 minutes).
   From data: average intake minus weight change (7,700 kcal per kg), once 14+ days are logged. */
function latestWeight(){const T=today();for(let i=0;i<60;i++){const w=logOf(addDays(T,-i)).weight;if(w!=null)return w}return profile().startWeight}
function bmrOf(w){const bf=latestBF();return FormaSmart.bmr(w,bf?bf.pct:null,profile().body);const b=profile().body||{};const h=b.heightCm||175,a=b.age||30,sx=b.sex==='female'?-161:5;return 10*w+6.25*h-5*a+sx}
function maintFor(steps,liftMin){const bf=latestBF();return FormaSmart.maint(latestWeight(),bf?bf.pct:null,profile().body,steps,liftMin)}
function woMinutes(d){const wo=logOf(d).workout;if(!wo||!wo.finishedAt)return 0;return Math.min(150,Math.max(0,(new Date(wo.finishedAt)-new Date(wo.startedAt))/60000))}
function smartNow(){
 const pr=profile(),T=today(),bf=latestBF(),days=[];
 for(let i=28;i>=1;i--){const d=addDays(T,-i),f=food(d).items;days.push({d,kcal:f.reduce((a,x)=>a+num(x.kcal),0),logged:f.length>0,weight:logOf(d).weight})}
 const liftDays=Object.values(program().weekdays).filter(x=>x!=='rest').length;
 const formula=FormaSmart.weekFormula(latestWeight(),bf?bf.pct:null,pr.body,pr.stepGoal,liftDays);
 return FormaSmart.smart({days,formula,targetKcal:pr.targets.kcal,goalRate:pr.goalRate||0.7});
}
function maintCard(){
 const pr=profile(),T=today(),b=pr.body||{},sg=pr.stepGoal,sm=smartNow(),goal=pr.goalRate||0.7;
 const train=maintFor(sg,60),rest=maintFor(sg,0);
 const fmt=v=>rnd(v).toLocaleString('en-US'),pct=Math.round(sm.conf*100);
 const row=(l,v,sub)=>`<div class="kv"><span class="mut">${l}${sub?`<div class="xs" style="color:var(--faint)">${sub}</div>`:''}</span><span>${v}</span></div>`;
 const ck=(view(P_CHK)||{checkins:[]}).checkins,lastCk=ck.length?ck[ck.length-1]:null;
 const stTxt={collecting:['var(--mut)','Collecting data. Log food and weigh in daily; the estimate starts learning after about 7 logged days and 10 days of weigh-ins.'],
  'on pace':['var(--ok)','On pace: losing about '+(sm.rate==null?'':Math.abs(sm.rate).toFixed(2))+' kg a week (goal '+goal+').'],
  fast:['var(--warn)','Losing faster than planned ('+(sm.rate==null?'':Math.abs(sm.rate).toFixed(2))+' kg a week). Next check-in raises calories.'],
  slow:['var(--warn)','Losing slower than planned ('+(sm.rate==null?'':Math.abs(sm.rate).toFixed(2))+' kg a week). Next check-in lowers calories.']}[sm.status];
 const kgWk=(sm.tdee-pr.targets.kcal)*7/7700;
 return `<div class="card"><div class="row"><div class="sp"><h3>Maintenance</h3><div class="mut sm">${sm.conf>0?'Learned from your logs, '+pct+'% confident':'Formula estimate until your logs take over'}</div></div><div style="text-align:right"><b style="font-size:20px">~${fmt(sm.tdee)}</b><div class="xs mut">kcal a day</div></div></div>
 <div class="sm" style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--inset);border-left:3px solid ${stTxt[0]}">${stTxt[1]}</div>
 <div style="margin-top:6px">
 ${row('Weight trend',sm.trendNow?sm.trendNow.toFixed(1)+' kg':'-',sm.rate==null?sm.weighIns+' weigh-ins in 28 days':(sm.rate<=0?'-':'+')+Math.abs(sm.rate).toFixed(2)+' kg a week, smoothed')}
 ${row('Average intake',sm.avgIn?fmt(sm.avgIn):'-',sm.eatDays+' logged day'+(sm.eatDays===1?'':'s')+' in 28')}
 ${row('Measured from your data',sm.measured?fmt(sm.measured):'<span class="mut">not yet</span>',sm.measured?'intake + what your weight trend burned':'needs 7 logged days and 10 days of weigh-ins')}
 ${row('Formula',fmt(sm.formula),'lifting '+fmt(train.total)+', rest '+fmt(rest.total))}
 ${row('<b style="color:var(--txt)">Suggested target</b>','<b>'+fmt(sm.suggested)+'</b>','for '+goal+' kg a week; current '+fmt(pr.targets.kcal))}
 ${lastCk?row('Last check-in',fmtShort(lastCk.date),lastCk.prevTarget===lastCk.target?'kept '+fmt(lastCk.target):fmt(lastCk.prevTarget)+' to '+fmt(lastCk.target)):''}
 </div>
 <div class="xs mut" style="margin-top:8px">At ${fmt(pr.targets.kcal)} you should lose about ${Math.abs(kgWk).toFixed(2)} kg a week. Claude checks in every Sunday and moves the target at most 150 kcal toward the suggestion.</div>
 <details class="xs mut" style="margin-top:8px"><summary>How the formula works</summary><div style="margin-top:6px">${row('Body at rest (BMR)',fmt(train.bmr),'at '+train.w+' kg'+(latestBF()?', from your body fat':''))}${row('Daily life and digestion','+'+fmt(train.life))}${row(sg.toLocaleString('en-US')+' steps','+'+fmt(train.walk))}${row('Lifting, about 60 min','+'+fmt(train.lift))}</div></details>
 ${!latestBF()&&(b.assumed||!b.heightCm)?`<div class="xs" style="color:var(--warn);margin-top:8px">Assumes ${b.sex||'male'}, ${b.age||30} years, ${b.heightCm||175} cm. Tell Claude your real height and age.</div>`:''}</div>`;
}
function progressView(){
 const pr=profile(),T=today();
 /* weight */
 const wp=[];for(let i=0;i<30;i++){const d=addDays(T,-(29-i)),w=logOf(d).weight;if(w!=null)wp.push({i,v:w})}
 const now=wp.length?wp[wp.length-1].v:null,delta=now==null?0:now-pr.startWeight;
 const wcard=wp.length>=2?lineChart(wp,pr.startWeight):`<div class="empty">${wp.length?'One weigh-in so far. Log another to see a trend.':'No weight logged yet. Log it from the Today tab.'}</div>`;
 /* steps */
 const sv=[],sl=[];for(let i=13;i>=0;i--){const d=addDays(T,-i);sv.push(logOf(d).steps);sl.push(parseD(d).getDate())}
 const sd=sv.filter(x=>x!=null),savg=sd.length?rnd(sd.reduce((a,b)=>a+b,0)/sd.length):0;
 /* calories */
 const cv=[],cl=[];let logged=0;for(let i=6;i>=0;i--){const d=addDays(T,-i),k=totals(d).kcal;cv.push(k);cl.push('SMTWTFS'[parseD(d).getDay()]);if(k>0)logged++}
 /* workouts */
 const wk=weekDates(T);let planned=0,did=0;wk.forEach(d=>{if(progDay(d))planned++;const w=logOf(d).workout;if(w&&w.finishedAt)did++});
 /* streak */

 return header('Progress')+maintCard()+bodyCard()+`
 <div class="card"><div class="row"><div class="sp"><h3>Weight</h3><div class="mut sm">Last 30 days</div></div><div style="text-align:right"><b style="font-size:20px">${now==null?'-':now+' kg'}</b><div class="xs ${delta<=0?'':'mut'}" style="color:${delta<=0?'var(--ok)':'var(--warn)'}">${now==null?'':(delta>0?'+':'')+delta.toFixed(1)+' since start ('+pr.startWeight+')'}</div></div></div>${wcard}</div>
 <div class="card"><div class="row"><div class="sp"><h3>Steps</h3><div class="mut sm">Last 14 days, goal ${pr.stepGoal.toLocaleString('en-US')}</div></div><div style="text-align:right"><b style="font-size:20px">${savg.toLocaleString('en-US')}</b><div class="xs mut">average</div></div></div>${sd.length?barChart(sv,sl,pr.stepGoal,v=>v/1000+'k'):'<div class="empty">No steps logged. Add them from the Today tab.</div>'}</div>
 <div class="card"><div class="row"><div class="sp"><h3>Calories</h3><div class="mut sm">Last 7 days, target ${pr.targets.kcal}</div></div><div style="text-align:right"><b style="font-size:20px">${logged}/7</b><div class="xs mut">days logged</div></div></div>${logged?barChart(cv,cl,pr.targets.kcal):'<div class="empty">No meals logged this week. Add food or ask Claude.</div>'}</div>
 ${stepsCalCard()}
 <div class="row"><div class="card sp" style="margin:0 0 12px"><div class="xs mut">Workouts this week</div><div class="big">${did}<span class="mut sm" style="font-weight:400"> of ${planned}</span></div></div><div class="card sp" style="margin:0 0 12px"><div class="xs mut">Logging streak</div><div class="big">${streak}<span class="mut sm" style="font-weight:400"> day${streak===1?'':'s'}</span></div></div></div>`;
}

async function setupSave(){
 const repo=$('#s_repo').value.trim(),tok=$('#s_tok').value.trim(),err=$('#s_err');
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){err.textContent='The repo should look like owner/name.';return}
 if(!tok){err.textContent='Paste your key first.';return}
 if(!/^(github_pat_|ghp_)\w{20,}$/.test(tok)){err.textContent='That is not a key yet. The key is a long code that starts with github_pat_. Tap "Create my key on GitHub" above to get one.';return}
 err.textContent='Testing...';const old=cfg;cfg={token:tok,repo};
 try{const r=await gh('GET','/contents/'+P_PROFILE+'?ref=main');
  if(r.status===401){throw new Error('GitHub says this key is wrong or expired. Copy it again, or make a new one.')}

  case 'camOpen':camOpen();break;
  case 'camClose':camClose();break;
  case 'camPose':CAM.pose=D.p;camUI();break;
  case 'camGrid':CAM.grid=!CAM.grid;camUI();break;
  case 'camFlipG':CAM.flip=!CAM.flip;camUI();break;
  case 'camSwitch':CAM.facing=CAM.facing==='user'?'environment':'user';await camStart();camUI();break;
  case 'camTimer':CAM.timer=CAM.timer===0?3:CAM.timer===3?10:0;camUI();break;
  case 'camShoot':camShoot();break;
  case 'camRetake':CAM.shot=null;camUI();break;
  case 'camUse':camUse();break;
  case 'tlPose':UI.tlPose=D.p;UI.tlIdx=null;render();break;
  case 'actOpen':openSheet(actSheet(),actSheet);break;
  case 'actKind':actK=D.k;document.querySelectorAll('#act_k button').forEach(b=>b.classList.toggle('b',b.dataset.k===D.k));break;
  case 'actSave':{const m=Math.round(num($('#act_min').value));if(!m){toast('Add the minutes.');break}
   const a={id:uid(),kind:actK,min:m,kcal:actKcal(actK,m,latestWeight()),by:'app'};mutate(logP(UI.date),{k:'actAdd',a});openSheet(actSheet(),actSheet);break}
  case 'actDel':mutate(logP(UI.date),{k:'actDel',id:D.id});openSheet(actSheet(),actSheet);break;
  case 'gotoFood':UI.tab='food';LS.set('forma.ui',{tab:UI.tab,mode:UI.mode});window.scrollTo(0,0);render();break;
  case 'gotoBody':UI.tab='progress';LS.set('forma.ui',{tab:UI.tab,mode:UI.mode});render();{const h=[...document.querySelectorAll('.card h3')].find(x=>x.textContent==='Body');if(h)h.scrollIntoView({block:'start'})}break;
  case 'bodyAll':openSheet(bodyAllSheet(),bodyAllSheet);break;
  case 'phRemove':foodPhoto='remove';{const im=$('#f_phimg');im.style.display='none';im.src='';$('#f_phrm').style.display='none';$('#f_phpick').textContent='Add photo'}break;
  case 'phView':{const src=t.getAttribute('src');if(!src)break;let ov=$('#ov');const full=document.createElement('div');full.id='ov';full.className='full';full.innerHTML='<img src="'+esc(src)+'" alt="">';full.addEventListener('click',()=>full.remove());document.body.appendChild(full);break}
  case 'foodSave':{
   const name=$('#f_name').value.trim();if(!name){toast('Give the food a name first.');return}
   const g=id=>num($('#f_'+id).value);
   const old=D.id?food(UI.date).items.find(i=>i.id===D.id):null;
   const id=D.id||uid();
   const item=Object.assign({},old||{},{id,meal:foodMeal,name,amount:$('#f_amount').value.trim(),kcal:g('kcal'),protein:g('protein'),carbs:g('carbs'),fat:g('fat'),by:old?old.by:'app',t:old?old.t:new Date().toISOString()});
   if(foodPhoto==='remove')delete item.photo;
   else if(foodPhoto){const p='data/photos/'+UI.date+'/'+id+'.jpg';DB.photos[p]=foodPhoto.split(',')[1];item.photo=p}
   foodPhoto=null;mutate(foodP(UI.date),{k:old?'foodUpd':'foodAdd',item});closeSheet();break}
  case 'foodDel':mutate(foodP(UI.date),{k:'foodDel',id:D.id});closeSheet();break;
  case 'wday':UI.wDay=D.id;UI.wSel=T;render();break;
  case 'wStart':if(UI.wDay&&D.id)startWorkout(D.id);break;
  case 'wFinish':mutate(logP(T),{k:'wFinish',t:new Date().toISOString()},{delay:0});UI.rest=null;break;
  case 'wReopen':mutate(logP(T),{k:'wReopen'},{delay:300});break;
  case 'wCancel':if(confirm('Discard this workout and all its sets?'))mutate(logP(T),{k:'wClear'},{delay:300});break;
  case 'cues':UI.cues[D.ex]=!UI.cues[D.ex];render();break;
  case 'addSet':editSets(D.ex,s=>{const l=s[s.length-1]||{w:0,r:0};s.push({w:l.w,r:l.r,done:false})},{delay:2000});break;
  case 'rmSet':editSets(D.ex,s=>{if(s.length>1)s.pop()},{delay:2000});break;
  case 'chk':{
   let on=false;
   editSets(D.ex,s=>{const x=s[+D.i];x.done=!x.done;on=x.done;
    if(on&&!x.w&&!x.r){const pv=prevFor(D.ex),p=pv&&(pv[+D.i]||pv[pv.length-1]);if(p){x.w=p.w;x.r=p.r}else{const wo=logOf(T).workout,slot=program().days.find(d=>d.id===wo.dayId).exercises.find(q=>effEx(wo,q.ex)===D.ex);const m=slot&&String(slot.reps).match(/\d+/g);x.r=m?+m[m.length-1]:0}}
   },{delay:2000});
   if(on)startRest(120);else{UI.rest=null;}render();break}
  case 'rest30':if(UI.rest){UI.rest.end+=30000;UI.rest.total+=30;updateRest()}break;
  case 'restSkip':UI.rest=null;updateRest();break;
  case 'swap':{
   const wo=logOf(T).workout,slot=D.slot,eff=effEx(wo,slot),orig=exdb().exercises[slot]||{};
   const opts=[...(eff!==slot?[slot]:[]),...(orig.a||[])].filter(x=>x!==eff);
   openSheet(`<h2>Swap ${esc(exName(slot))}</h2><div class="mut sm" style="margin-bottom:10px">Only for today. Your sets move over.</div>${opts.length?opts.map(x=>`<button class="item" data-act="doSwap" data-slot="${slot}" data-to="${x}"><div class="sp"><div class="n">${esc(exName(x))}${x===slot?' (original)':''}</div><div class="xs mut">${esc((exdb().exercises[x]||{}).eq||'')}</div></div></button>`).join(''):'<div class="empty">No alternatives listed for this exercise.</div>'}`);break}
  case 'doSwap':{const wo=logOf(T).workout;const from=effEx(wo,D.slot);mutate(logP(T),{k:'wSwap',slot:D.slot,alt:D.to,moved:true,from,to:D.to},{delay:1000});closeSheet();break}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='cam_op'){CAM.op=+e.target.value/100;const g=document.querySelector('#cam .gh');if(g)g.style.opacity=CAM.op;const v=$('#cam_opv');if(v)v.textContent=e.target.value+'%';return}
 if(e.target.id==='tl_rng'){UI.tlIdx=+e.target.value;const es=tlEntries(progPhotos(),UI.tlPose),x=es[UI.tlIdx];if(!x)return;const i=$('#tl_img');i.src=photoURL(x.p)||i.src;$('#tl_d').textContent=tlLabel(x);$('#tl_m').textContent=tlMeta(x)}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='pp_in'&&e.target.files&&e.target.files.length){
  const fl=[...e.target.files];e.target.value='';let n=0;
  for(const f of fl){try{const u=await shrinkImage(f);const p='data/progress/'+today()+'/'+uid()+'.jpg';DB.photos[p]=u.split(',')[1];PHOTOS[p]=u;n++}catch(x){}}
  persist();toast0(n+' photo'+(n===1?'':'s')+' saved. Ask Claude for a body fat estimate.');render();flushSoon(300);return;
 }
 if(e.target.id!=='f_photo'||!e.target.files||!e.target.files[0])return;
 try{foodPhoto=await shrinkImage(e.target.files[0]);const im=$('#f_phimg');im.src=foodPhoto;im.style.display='';$('#f_phrm').style.display='';$('#f_phpick').textContent='Change photo'}
 catch(x){toast('Could not read that photo.')}
 e.target.value='';
});
function toast0(m){const t=document.createElement('div');t.className='toast';t.style.cssText+=';background:var(--okbg);border-color:var(--okline);color:var(--oktx)';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.m)UI.open[d.dataset.m]=d.open},true);
document.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.f)return;
 const v=t.value.trim()===''?0:num(t.value);
 editSets(t.dataset.ex,s=>{if(s[+t.dataset.i])s[+t.dataset.i][t.dataset.f]=v},{quiet:true,delay:2000});
});
let ty=null;
document.addEventListener('touchstart',e=>{ty=window.scrollY===0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>110&&!UI.sheet){verChecked=0;checkVersion();refresh(true)}ty=null},{passive:true});

/* ---------- boot ---------- */
(async function boot(){
 if(DEMO){await DEMOB.init();render();await refresh(true);return}
 render();
 checkVersion();
 if(cfg.token){await refresh();if(pendCount())flushSoon(200)}
})();
</script>
</body>
</html>
