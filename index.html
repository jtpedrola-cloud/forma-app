function applyOp(d,o){
 const w=()=>d.workout||(d.workout={dayId:o.dayId||null,startedAt:new Date().toISOString(),finishedAt:null,sets:{},swaps:{}});
 switch(o.k){
  case 'foodAdd':if(!d.items.some(i=>i.id===o.item.id))d.items.push(o.item);break;
  case 'foodUpd':{const i=d.items.findIndex(x=>x.id===o.item.id);if(i>=0)d.items[i]=o.item;else d.items.push(o.item);break}
  case 'foodDel':d.items=d.items.filter(i=>i.id!==o.id);break;
  case 'steps':case 'weight':case 'note':d[o.k]=o.v;break;
  case 'wStart':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:null,sets:o.sets,swaps:{}};break;
  case 'wSets':w().sets[o.ex]=o.sets;if(o.t)w().lastAt=o.t;break;
  case 'wTimes':{const x=w();if(o.s)x.startedAt=o.s;if(o.f!==undefined)x.finishedAt=o.f;break}
  case 'wNote':{const x=w();if(o.v)x.note=o.v;else delete x.note;break}
  case 'wFinalize':{const x=w();Object.keys(x.sets||{}).forEach(ex=>{let a=x.sets[ex]||[];
    if(o.mode==='tick')a.forEach(z=>{if(!z.done&&(num(z.r)>0))z.done=true});
    a=a.filter(z=>z.done);if(a.length)x.sets[ex]=a;else delete x.sets[ex]});
    if(x.extra){x.extra=x.extra.filter(e=>x.sets[(x.swaps&&x.swaps[e.ex])||e.ex]);if(!x.extra.length)delete x.extra}break}
  case 'wSwap':{const x=w();x.swaps=x.swaps||{};if(o.alt===o.slot)delete x.swaps[o.slot];else x.swaps[o.slot]=o.alt;
    if(o.moved&&x.sets[o.from]&&!x.sets[o.to]){x.sets[o.to]=x.sets[o.from];delete x.sets[o.from]}break}
  case 'exNew':{d.exercises=d.exercises||{};if(!d.exercises[o.id])d.exercises[o.id]=clone(o.ex);break}
  case 'wExtra':{const x=w();x.extra=x.extra||[];if(!x.extra.some(e=>e.ex===o.ex)){x.extra.push({ex:o.ex,sets:o.n});if(!x.sets[o.ex])x.sets[o.ex]=Array.from({length:o.n},()=>({w:0,r:0,done:false}))}break}
  case 'wExtraDel':{const x=w(),sl=(x.swaps&&x.swaps[o.ex])||o.ex;x.extra=(x.extra||[]).filter(e=>e.ex!==o.ex);if(!x.extra.length)delete x.extra;delete x.sets[sl];if(x.swaps)delete x.swaps[o.ex];break}
  case 'wFinish':w().finishedAt=o.t;break;
  case 'wReopen':w().finishedAt=null;break;
  case 'wClear':d.workout=null;break;
  case 'merge':Object.assign(d,clone(o.data));break;
  case 'gym':{if(d.intake&&d.intake.answers){d.intake.answers.gym=o.tiles.slice();d.intake.answers.equipment=o.equipment.slice();d.intake.answers.equipPreset='custom'}else d.gym={tiles:o.tiles.slice(),equipment:o.equipment.slice()};break}
  case 'replace':d=clone(o.doc);break;
  case 'wMark':if(!d.workout)d.workout={dayId:o.dayId,startedAt:o.t,finishedAt:o.t,sets:{},swaps:{},marked:true};break;
  case 'mealAdd':d.meals=d.meals||[];if(!d.meals.some(m=>m.id===o.meal.id))d.meals.push(clone(o.meal));break;
  case 'mealDel':d.meals=(d.meals||[]).filter(m=>m.id!==o.id);break;
  case 'recAdd':d.recipes=d.recipes||[];if(!d.recipes.some(r=>r.id===o.rec.id))d.recipes.push(clone(o.rec));break;
  case 'recDel':d.recipes=(d.recipes||[]).filter(r=>r.id!==o.id);break;
  case 'myfAdd':d.foods=d.foods||[];if(!d.foods.some(f=>f.id===o.food.id))d.foods.push(clone(o.food));break;
  case 'myfDel':d.foods=(d.foods||[]).filter(f=>f.id!==o.id);break;
  case 'measure':{d.measure=Object.assign(d.measure||{},o.v);Object.keys(d.measure).forEach(k=>{if(d.measure[k]==null)delete d.measure[k]});if(!Object.keys(d.measure).length)delete d.measure;break}

/* The last 28 days: dots are weigh-ins, the line is the least-squares trend (the same line the verdict reads). */
function trendSvg(ws){

 const ys=pts.map(p=>p.v),mn=Math.min(...ys)-.4,mx=Math.max(...ys)+.4,X=i=>px+i/27*(W-px*2),Y=v=>H-py-(v-mn)/(mx-mn)*(H-py*2);
 const n=pts.length,mx0=pts.reduce((a,p)=>a+p.i,0)/n,my0=ys.reduce((a,b)=>a+b,0)/n,sxx=pts.reduce((a,p)=>a+(p.i-mx0)**2,0),sl=sxx?pts.reduce((a,p)=>a+(p.i-mx0)*(p.v-my0),0)/sxx:0,at=i=>my0+sl*(i-mx0);

 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend, last 28 days">${pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" style="fill:var(--mut);opacity:.6"/>`).join('')}<line x1="${X(a).toFixed(1)}" y1="${Y(at(a)).toFixed(1)}" x2="${X(b).toFixed(1)}" y2="${Y(at(b)).toFixed(1)}" style="stroke:var(--acc)" stroke-width="3" stroke-linecap="round"/><text x="${px}" y="${H-1}" font-size="12" style="fill:var(--mut)">28 days ago</text><text x="${W-px}" y="${H-1}" font-size="12" style="fill:var(--mut)" text-anchor="end">today</text></svg>`;
}

const logDates=()=>{const s=new Set();Object.keys(DB.tree).concat(Object.keys(DB.files)).forEach(p=>{const m=p.match(/^data\/log\/(\d{4}-\d{2}-\d{2})\.json$/);if(m)s.add(m[1])});return [...s].sort()};

 for(let i=0;i<ds.length;i+=12){try{await Promise.all(ds.slice(i,i+12).map(d=>fetchFile(logP(d))))}catch(e){break}}

const e1rm=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
const setVol=z=>num(z.w)*num(z.r)+(z.drops||[]).reduce((a,x)=>a+num(x.w)*num(x.r),0);
/* Bests over a list of sessions: heaviest set, most reps, best Epley 1RM (w x (1 + r / 30)), best session volume and best session reps. */
function foldBest(ses){const b={n:ses.length,w:0,wr:0,wd:'',reps:0,rw:0,rd:'',e1:0,e1w:0,e1r:0,e1d:'',vol:0,vd:'',rv:0,rvd:''};
 ses.forEach(s=>{let v=0,tr=0;s.sets.forEach(z=>{const w=num(z.w),r=num(z.r);
  if(w>b.w||(w===b.w&&w>0&&r>b.wr)){b.w=w;b.wr=r;b.wd=s.d}
  if(r>b.reps||(r===b.reps&&w>b.rw)){b.reps=r;b.rw=w;b.rd=s.d}
  const e=e1rm(w,r);if(e>b.e1){b.e1=e;b.e1w=w;b.e1r=r;b.e1d=s.d}
  v+=setVol(z);tr+=r});

/* ---------- phone back button ----------
   Each overlay (sheet, camera, full-screen photo) adds a history entry, so Android's back closes it instead of
   leaving the app. Closing from the UI pops that entry (navPop). Pushes made while a pop is still in flight are
   queued, so close-then-open sequences keep the history in order. Tabs: Today is the base entry, any other tab
   is one entry above it, so back from Food, Workout or Progress returns to Today and back on Today exits. */

function navPop(){navPending++;history.back()}

/* Same limits as the normal sheets: weight 20 to 400 kg, steps whole 0 to 100,000, kcal at most 5,000 and macros at most 500 g per item, sport 1 to 600 minutes, tape 5 to 250 cm */
function cmdMsg(a,f,v,cj){
 if(f==='weight'){const kg=u2kg(v);return kg>=20&&kg<=400?'':'Enter a weight from '+fw(20,0)+' to '+fw(400,0)+' '+wU()+'.'}
 if(f==='steps')return v>=0&&v<=100000&&Math.floor(v)===v?'':'Enter steps from 0 to 100,000.';
 if(f==='min')return v>=1&&v<=600&&Math.floor(v)===v?'':'Enter 1 to 600 minutes.';
 if(f==='measure'){const cm=uCm(v);return cm>=5&&cm<=250?'':'That measurement looks off. Check the number.'}
 if(f==='kcal'){
  if(!(v>=0))return 'Calories cannot be below 0.';
  if(v>5000)return 'Calories are at most 5,000 per item.';
  const it=(a.items||[])[cj];if(it){const r=it.kcal>0?v/it.kcal:1;for(const [k,l] of [['protein','Protein'],['carbs','Carbs'],['fat','Fat']])if(Math.round(num(it[k])*r)>500)return l+' is at most 500 g per item.'}}
 return ''}
function cmdModelMsg(a,f,j){
 if(f==='weight')return cmdMsg(a,f,kg2u(a.kg));
 if(f==='steps')return cmdMsg(a,f,a.n);
 if(f==='min')return cmdMsg(a,f,a.min);
 if(f==='measure')return cmdMsg(a,f,cmU(a.cm));
 if(f==='kcal'){const it=(a.items||[])[j];return it?cmdMsg(a,f,num(it.kcal),j):''}
 return ''}
function cmdAnyErr(){return Object.keys(CMD.bad||{}).length>0||CMD.acts.some((a,i)=>a.k==='food'?a.items.some((_,j)=>cmdModelMsg(a,'kcal',j)):cmdModelMsg(a,{weight:'weight',steps:'steps',sport:'min',measure:'measure'}[a.k]))}
function cmdRow(i,j,title,sub,val,unit,fld,est){const b=fld&&(CMD.bad||{})[i+':'+j+':'+fld],em=fld?(b?b.m:cmdModelMsg(CMD.acts[i]||{},fld,j)):'';if(b)val=b.raw;
 return `<div class="crow"><div class="sp"><div class="n">${esc(title)}</div><div class="xs mut">${sub}</div>${cmdEst(est)}${em?`<div class="ferr" role="alert">${esc(em)}</div>`:''}</div>${fld?`<div class="cin"><input inputmode="decimal" value="${esc(val)}" data-ci="${i}" data-cj="${j}" data-cf="${fld}" aria-label="${esc(title)}"${em?' aria-invalid="true"':''}><span class="xs mut">${esc(unit)}</span></div>`:''}<button class="ib" data-act="cmdDrop" data-ci="${i}" data-cj="${j}" aria-label="Remove ${esc(title)}">${ic('x',18)}</button></div>`}
function cmdSheet(){
 const rows=[];
 CMD.acts.forEach((a,i)=>{
  if(a.k==='weight')rows.push(cmdRow(i,-1,'Weight','Body weight',fw(a.kg),wU(),'weight'));
  else if(a.k==='steps')rows.push(cmdRow(i,-1,a.atLeast?'Steps at least '+fmtN(a.n)+(a.km?' (from '+a.km+' km)':''):'Steps',CMD.date===today()?'Today':fmtShort(CMD.date),a.n,'steps','steps',a.estimated));
  else if(a.k==='sport')rows.push(cmdRow(i,-1,actName(a.kind),'About '+a.kcal+' kcal'+(a.assumed?' (assumed 80 kg)':''),a.min,'min','min',a.estimated));
  else if(a.k==='measure')rows.push(cmdRow(i,-1,measName(a.site),'Tape measurement',fmc(a.cm),mU(),'measure'));
  else if(a.k==='journal')rows.push(cmdRow(i,-1,'Food journal',esc(a.text),'','',''));
  else if(a.k==='note')rows.push(cmdRow(i,-1,'Note',esc(a.text),'','',''));
  else if(a.k==='food'){rows.push(`<div class="cmeal">Meal ${a.meal}</div>`);a.items.forEach((it,j)=>rows.push(cmdRow(i,j,it.name,esc(it.amount||'')+(it.assumed&&!/assumed/.test(it.amount||'')?' (assumed)':'')+'<br>P '+rnd(it.protein)+'g, C '+rnd(it.carbs)+'g, F '+rnd(it.fat)+'g',rnd(it.kcal),'kcal','kcal')))}
 });
 const unk=(CMD.res.issues||[]).map((u,k)=>`<div class="cunk"><div class="n">${esc(u.text)}</div><div class="xs">${cmdWhy(u.why)}</div><button class="btn ghost sm" style="margin-top:8px" data-act="cmdHand" data-k="${k}">Add by hand</button></div>`).join('');
 const n=CMD.acts.reduce((a,x)=>a+(x.k==='food'?x.items.length:1),0);
 const ask=(CMD.res.issues||[]).length?(CMD.busy?`<div class="row" style="gap:12px;margin:12px 0 2px"><span class="spin"></span><b>Asking Claude</b></div>`:`<button class="btn full" style="margin-top:10px" data-act="cmdAI">${aiReady()?'Ask AI':'Ask AI (needs key)'}</button>`):'';
 const aiMsg=(CMD.aiErr?`<div class="cunk" style="margin-top:8px"><div class="n">${esc(CMD.aiErr)}</div></div>`:'')+(CMD.aiNotes.length?`<div class="xs mut" style="margin-top:8px">${CMD.aiNotes.map(x=>'Assumed: '+esc(x)).join('<br>')}</div>`:'');
 return `<h2>Check before saving</h2><div class="xs mut" style="margin:-6px 0 8px;word-break:break-word">${esc(CMD.line)}${CMD.date!==today()?`<br>For ${dayWord(CMD.date).toLowerCase()==='yesterday'?'yesterday':fmtLong(CMD.date)}`:''}</div>${rows.join('')||'<div class="empty">Nothing understood.</div>'}${unk}${ask}${aiMsg}
 <div class="row" style="margin-top:14px"><button class="btn ghost" data-act="cmdCancel">Cancel</button><button class="btn sp" data-act="cmdSave" ${n&&!cmdAnyErr()?'':'disabled'}>Save${n?' '+n+' item'+(n===1?'':'s'):''}</button></div>`}
/* Ask AI: the whole line plus the foods already understood go to Claude; its rows join the preview (marked assumed) */
async function cmdAI(){
 if(!CMD.res||CMD.busy)return;
 if(!aiReady()){CMD.seq++;closeSheet();openSheet(settingsSheet());return}
 const my=++CMD.seq,known=[];CMD.busy=true;CMD.aiErr='';CMD.aiNotes=[];openSheet(cmdSheet(),cmdSheet);
 CMD.acts.forEach(a=>{if(a.k==='food')a.items.forEach(i=>known.push({name:i.name,amount:i.amount||'',kcal:rnd(i.kcal)}))});
 try{
  const r=await aiMeal({text:CMD.line,known,today:CMD.date});
  if(my!==CMD.seq||!CMD.res)return;
  CMD.busy=false;CMD.aiNotes=r.assumptions;
  if(!r.items.length)CMD.aiErr='Claude found no food in the part it could not read. Add it by hand.';
  else{
   let fa=CMD.acts.find(x=>x.k==='food');
   if(!fa){fa={k:'food',meal:window.FormaCmd?FormaCmd.mealNumber(CMD.ctx||{}):1,items:[]};CMD.acts.push(fa)}
   r.items.forEach(it=>fa.items.push(Object.assign({},it,{assumed:true})));
   CMD.res.issues=[];CMD.res.unknown=[];
  }
 }catch(e){if(my!==CMD.seq)return;CMD.busy=false;CMD.aiErr=aiErr(e)}
 if(UI.sheet&&UI.sheetFn===cmdSheet)openSheet(cmdSheet(),cmdSheet);
}
function cmdEdit(t){
 const a=CMD.acts[+t.dataset.ci];if(!a)return;const v=num(t.value),f=t.dataset.cf,key=t.dataset.ci+':'+t.dataset.cj+':'+f;
 CMD.bad=CMD.bad||{};const m=cmdMsg(a,f,v,+t.dataset.cj);
 if(m){CMD.bad[key]={raw:t.value.trim(),m};return}
 delete CMD.bad[key];
 if(f==='weight')a.kg=+u2kg(v).toFixed(2);
 else if(f==='steps')a.n=Math.round(v);
 else if(f==='measure')a.cm=+uCm(v).toFixed(1);
 else if(f==='min'){a.min=Math.round(v);a.kcal=actKcal(a.kind,a.min,CMD.wkg)}
 else if(f==='kcal'){const it=a.items[+t.dataset.cj];if(it){const r=it.kcal>0?v/it.kcal:1;['protein','carbs','fat'].forEach(k=>{it[k]=Math.round(num(it[k])*r)});it.kcal=Math.round(v)}}
}
function cmdSave(){
 if(cmdAnyErr()){openSheet(cmdSheet(),cmdSheet);return}
 const d=CMD.date;let n=0;
 CMD.acts.forEach(a=>{
  if(a.k==='weight'){mutate(logP(d),{k:'weight',v:+a.kg.toFixed(2)},{quiet:true});n++}
  else if(a.k==='steps'){const cur=num(logOf(d).steps);mutate(logP(d),{k:'steps',v:Math.round(a.atLeast?Math.max(cur,a.n):a.n)},{quiet:true});n++}
  else if(a.k==='measure'){mutate(logP(d),{k:'measure',v:{[a.site]:+(+a.cm).toFixed(1)}},{quiet:true});n++}
  else if(a.k==='note'){const old=(logOf(d).note||'').trim();mutate(logP(d),{k:'note',v:old?old+'. '+a.text:a.text},{quiet:true});n++}
  else if(a.k==='journal'){journalText(d,a.text);n++}
  else if(a.k==='sport'){mutate(logP(d),{k:'actAdd',a:{id:uid(),kind:a.kind,min:Math.round(a.min),kcal:Math.round(a.kcal),by:'app'}},{quiet:true});n++}
  else if(a.k==='food'){a.items.forEach(it=>{mutate(foodP(d),{k:'foodAdd',item:{id:uid(),meal:a.meal,name:it.name,amount:it.amount||'',kcal:rnd(it.kcal),protein:rnd(it.protein),carbs:rnd(it.carbs),fat:rnd(it.fat),by:'app',t:new Date().toISOString()}},{quiet:true});n++})}
 });
 const h=LS.get('forma.cmdHist',[]).filter(x=>x!==CMD.line);h.unshift(CMD.line);LS.set('forma.cmdHist',h.slice(0,10));
 cmdText='';cmdHi=-1;CMD.res=null;CMD.seq++;CMD.busy=false;closeSheet();render();toast0('Saved '+n+' item'+(n===1?'':'s')+(d!==today()?' for '+(d===addDays(today(),-1)?'yesterday':fmtShort(d)):'')+'.');
}
document.addEventListener('input',e=>{if(e.target.id==='cmd_in'){cmdText=e.target.value;cmdHi=-1}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.cf!==undefined&&CMD.res){cmdEdit(t);openSheet(cmdSheet(),cmdSheet)}});
document.addEventListener('keydown',e=>{
 if(e.target.id!=='cmd_in')return;
 if(e.key==='Enter'){e.preventDefault();cmdText=e.target.value;cmdRun()}
 else if(e.key==='ArrowUp'||e.key==='ArrowDown'){const h=LS.get('forma.cmdHist',[]);if(!h.length)return;e.preventDefault();
  cmdHi=e.key==='ArrowUp'?Math.min(h.length-1,cmdHi+1):cmdHi-1;e.target.value=cmdHi<0?'':h[cmdHi];cmdText=e.target.value}
});

/* ---------- AI (Claude): the key lives only in this phone's localStorage, calls go from this page straight to api.anthropic.com (app/ai.js) ---------- */
const aiKey=()=>{try{return localStorage.getItem('forma.aiKey')||''}catch(e){return ''}};
const aiKeySet=k=>{try{if(k)localStorage.setItem('forma.aiKey',k);else localStorage.removeItem('forma.aiKey')}catch(e){}};
const aiModel=()=>LS.get('forma.aiModel','haiku')==='sonnet'?'sonnet':'haiku';
const AI={testing:false,err:'',msg:''};
const aiConnected=()=>{const k=aiKey();return !!k&&LS.get('forma.aiOk','')===k.slice(-6)};
const aiErr=e=>e&&e.name==='AIError'?e.message:'Something went wrong. Try again.';
/* Signed in: the ai-meal function with the user's token, 5 reads a day counted on the server. Signed out: personal mode, the key on this phone. */
const aiServer=()=>!!SBS.user&&B.kind==='supabase';
const aiReady=()=>aiServer()||(!!aiKey()&&!!window.FormaAI);
function recentNames(){const out=[],seen={};for(let i=0;i<=14&&out.length<20;i++){const f=cur(foodP(addDays(today(),-i)));((f&&f.items)||[]).slice().reverse().forEach(it=>{const k=String(it.name||'').toLowerCase();if(k&&!seen[k]&&out.length<20){seen[k]=1;out.push(String(it.name).slice(0,60))}})}return out}
async function aiMeal(o){
 if(!aiServer())return FormaAI.meal(Object.assign({key:aiKey(),model:aiModel(),profile:profile()},o));
 const known=(o.known||[]).filter(k=>k&&k.name).map(k=>k.name+(k.amount?' ('+k.amount+')':''));
 const note=[o.note,known.length?'Already logged from this line, do not return them again: '+known.join('; ')+'.':''].filter(Boolean).join(' ')||undefined;
 try{
  const r=await FormaAI.mealServer({post:(b,sig)=>B.callFn('ai-meal',b,sig),imageBase64:o.imageBase64,text:o.text,note,units:unitsNow(),recent:recentNames()});
  if(r.limit)SBS.limit=r.limit;if(r.used!=null){SBS.used=r.used;SBS.usedDay=mDay()}
  return r;
 }catch(e){if(e&&e.code==='limit'){SBS.used=SBS.limit;SBS.usedDay=mDay()}throw e}
}
const aiLeft=()=>SBS.used!=null&&SBS.usedDay===mDay()?SBS.used:null;
function aiCounter(){
 if(!aiServer())return '';
 const u=aiLeft(),L=SBS.limit,full=u!=null&&u>=L;
 return `<div class="xs ${full?'':'mut'}" id="ai_cnt" style="text-align:center;margin:10px 0 0;${full?'color:var(--warn)':''}">${u==null?L+' AI reads a day':u+' of '+L+' AI reads today'}</div>`}
function aiSettings(){
 if(aiServer()){const u=aiLeft(),L=SBS.limit;
  return `<div class="fld"><label>AI (Claude)</label><div class="card" style="margin:0;padding:12px 14px">
 <div class="sm">Snap a meal and Ask AI are included with your account. No key needed.</div>
 <div class="sm" style="margin-top:8px"><b>${u==null?L+' reads a day':u+' of '+L+' AI reads used today'}</b></div>
 <div class="xs mut" style="margin-top:4px">The count resets every day at midnight in the Philippines. Everything else in Pulzo is unlimited.</div></div></div>`}
 const k=aiKey(),m=aiModel();
 const st=!k?['Not connected','var(--mut)']:AI.testing?['Testing...','var(--mut)']:AI.err?['Not working','var(--badtx)']:aiConnected()?['Connected','var(--ok)']:['Key saved, not tested yet','var(--mut)'];
 return `<div class="fld"><label>Personal mode key (Claude)</label><div class="card" style="margin:0;padding:12px 14px">
 <div class="xs mut" style="margin-bottom:8px">Only for personal mode, when you are not signed in. With a Pulzo account the AI is included and needs no key.</div>
 <div class="sm">Status: <b id="ai_st" style="color:${st[1]}">${st[0]}</b></div>
 ${AI.err?`<div class="xs" style="color:var(--badtx);margin-top:4px;word-break:break-word">${esc(AI.err)}</div>`:AI.msg&&aiConnected()?`<div class="xs mut" style="margin-top:4px;word-break:break-word">${esc(AI.msg)}</div>`:''}
 <div class="fld" style="margin:10px 0 8px"><input id="ai_key" type="password" placeholder="${k?'Key saved (ends '+esc(k.slice(-4))+'). Paste to replace.':'Paste your Claude API key'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
 <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn sm" data-act="aiSave">Save key</button><button class="lnk" data-act="aiTest" ${k&&!AI.testing?'':'disabled'}>Test</button>${k?'<button class="lnk" data-act="aiRemove">Remove key</button>':''}</div>
 <div class="fld" style="margin:12px 0 4px"><label>Model</label><div class="mods"><button data-act="aiModel" data-m="haiku" class="${m==='haiku'?'on':''}">Haiku (cheap, fast)</button><button data-act="aiModel" data-m="sonnet" class="${m==='sonnet'?'on':''}">Sonnet (more careful)</button></div></div>
 <div class="xs mut" style="margin-top:6px">About PHP 0.03 a photo on Haiku (about PHP 0.5 on Sonnet). The key stays on this phone and goes only to Anthropic.</div></div></div>`}
function aiReopenSettings(){if(UI.sheet&&UI.sheet.indexOf('id="ai_key"')>=0){const sh=$('#sheet'),y=sh?sh.scrollTop:0;openSheet(settingsSheet());const s2=$('#sheet');if(s2)s2.scrollTop=y}}
async function aiTest(){
 const k=aiKey();if(!k){toast('Paste your key and tap Save key first.');return}
 if(AI.testing)return;if(!window.FormaAI){toast('The AI reader did not load. Refresh the app.');return}
 AI.testing=true;AI.err='';AI.msg='';aiReopenSettings();
 try{const r=await FormaAI.test({key:k,model:aiModel()});LS.set('forma.aiOk',k.slice(-6));AI.msg='Claude answered: '+String(r.text||'').slice(0,40)+(r.model?' ('+r.model+')':'')}
 catch(e){LS.del('forma.aiOk');AI.err=aiErr(e)}
 AI.testing=false;aiReopenSettings();
}

/* ---------- Snap a meal: photo -> Claude -> rows to check -> saved like Claude saves meals (photo on the first item) ---------- */
const SNAP={photo:'',note:'',status:'',items:[],notes:[],raw:'',err:'',meal:1,date:'',seq:0};
function snapMealNo(d){
 const its=food(d).items,lastT=its.map(i=>i.t).filter(Boolean).sort().pop();
 return window.FormaCmd?FormaCmd.mealNumber({lastMealNo:its.length?Math.max(...its.map(mealNo)):0,lastMealAt:d===today()?(lastT||null):null,now:Date.now()}):(its.length?Math.max(...its.map(mealNo))+1:1);
}
const snapDraw=()=>{if(UI.sheet&&UI.sheetFn===snapSheet)openSheet(snapSheet(),snapSheet)};
async function snapStart(file){
 let photo;try{photo=await shrinkImage(file)}catch(e){toast('Could not read that photo.');return}
 Object.assign(SNAP,{photo,note:'',items:[],notes:[],raw:'',err:'',status:'',date:UI.date,seq:SNAP.seq+1});
 SNAP.meal=snapMealNo(SNAP.date);
 if(!aiReady()){closeSheet();addOpen(SNAP.meal,{photo,keep:true});toast0('Photo attached. Add the food by search.');return}
 SNAP.status='reading';openSheet(snapSheet(),snapSheet);snapAsk();
}
async function snapAsk(){
 const my=++SNAP.seq;SNAP.status='reading';SNAP.err='';SNAP.raw='';snapDraw();
 try{const r=await aiMeal({imageBase64:SNAP.photo,note:SNAP.note.trim()||undefined,today:SNAP.date});
  if(my!==SNAP.seq)return;SNAP.items=r.items;SNAP.notes=r.assumptions;SNAP.status='done'}
 catch(e){if(my!==SNAP.seq)return;SNAP.status='error';SNAP.err=aiErr(e);SNAP.raw=e&&e.raw||''}
 snapDraw();
}
function snapRow(j,it){return `<div class="crow"><div class="sp"><div class="n">${esc(it.name)}</div><div class="xs mut">${esc(it.amount||'')}<br>P ${rnd(it.protein)}g, C ${rnd(it.carbs)}g, F ${rnd(it.fat)}g</div></div><div class="cin"><input inputmode="decimal" value="${esc(rnd(it.kcal))}" data-sj="${j}" aria-label="${esc(it.name)} calories"><span class="xs mut">kcal</span></div><button class="ib" data-act="snapDrop" data-j="${j}" aria-label="Remove ${esc(it.name)}">${ic('x',18)}</button></div>`}
function snapSheet(){
 const S=SNAP,img=S.photo?`<img class="phbig" src="${esc(S.photo)}" alt="" data-act="phView">`:'';

 if(S.status==='nokey')body=`<div class="sm" style="margin:6px 0 12px">${FormaCopy.add.noAi}</div><div class="row"><button class="btn ghost sp" data-act="snapHand">Add by search</button><button class="btn sp" data-act="snapSettings">Open Settings</button></div>`;
 else if(S.status==='reading')body=`<div class="row" style="gap:12px;margin:10px 0 4px"><span class="spin"></span><b>Reading your meal</b></div><div class="xs mut" style="margin-bottom:12px">Claude is looking at the photo. A few seconds.</div><button class="btn ghost full" data-act="snapCancel">Cancel</button>`;
 else if(S.status==='error')body=`<div class="cunk"><div class="n">${esc(S.err)}</div>${S.raw?`<div class="xs" style="margin-top:6px;word-break:break-word;max-height:120px;overflow:auto">${esc(S.raw.slice(0,800))}</div>`:''}</div><div class="row" style="margin-top:12px"><button class="btn ghost sp" data-act="snapHand">Add by hand</button><button class="btn sp" data-act="snapAsk">Try again</button></div>`;
 else{
  const tot=S.items.reduce((a,i)=>{a.k+=rnd(i.kcal);a.p+=rnd(i.protein);a.c+=rnd(i.carbs);a.f+=rnd(i.fat);return a},{k:0,p:0,c:0,f:0}),n=S.items.length;

 }
 return `<h2>Snap a meal</h2><div class="xs mut" style="margin:-6px 0 8px">${fmtLong(S.date)}</div>${img}${body}${aiCounter()}`;

function snapSave(){

  if(j===0&&S.photo){const p='data/photos/'+d+'/'+item.id+'.jpg';DB.photos[p]=S.photo.split(',')[1];item.photo=p}

document.addEventListener('input',e=>{if(e.target.id==='snap_note')SNAP.note=e.target.value});
document.addEventListener('change',e=>{

document.addEventListener('touchstart',e=>{ty=window.scrollY===0?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>110&&!UI.sheet){verChecked=0;checkVersion();refresh(true)}ty=null},{passive:true});

/* the sheet rises above the on-screen keyboard (visual viewport) */
if(window.visualViewport){const kb=()=>{const v=visualViewport;document.documentElement.style.setProperty('--kb',Math.max(0,Math.round(innerHeight-v.height-v.offsetTop))+'px')};visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb)}
/* ---------- boot ---------- */
(async function boot(){
 if(/[?&]tab=workout/.test(location.search))UI.tab='workout';
 history.replaceState({tab:'today'},'');if(UI.tab!=='today')history.pushState({tab:UI.tab},'');
 await sbInit();
 if(DEMO){if(/[?&]tour=1/.test(location.search))LS.set('forma.tourPending',1);await DEMOB.init();render();await refresh(true);programParam();if(/[?&]intake=1/.test(location.search))intakeOpen();else tourMaybe();lessonsLoad().then(()=>{if(UI.tab==='progress'&&!document.getElementById('learn'))softRender()});return}
 render();
 checkVersion();
 if(hasAcct()){await refresh();if(pendCount())flushSoon(200);await programParam();tourMaybe();lessonsLoad().then(()=>{if(UI.tab==='progress'&&!document.getElementById('learn'))softRender()})}
})();
</script>
